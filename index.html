<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Invitación</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   PRIMERA PANTALLA
========================================================= */

.start-screen{
    position:fixed;
    inset:0;
    z-index:10;

    background-image:url("fondo toys story.png");
    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    opacity:1;
    transition:opacity .7s ease;

    overflow:hidden;
}

/* =========================================================
   ESTRELLAS
========================================================= */

.star{
    position:absolute;
    z-index:2;

    color:white;
    font-size:22px;

    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:twinkle 2s infinite ease-in-out;
}

.star:nth-child(1){left:5%;top:8%;animation-delay:.1s;}
.star:nth-child(2){left:14%;top:18%;animation-delay:.4s;}
.star:nth-child(3){left:25%;top:7%;animation-delay:.7s;}
.star:nth-child(4){left:36%;top:14%;animation-delay:1s;}
.star:nth-child(5){left:49%;top:6%;animation-delay:1.3s;}
.star:nth-child(6){left:61%;top:16%;animation-delay:.5s;}
.star:nth-child(7){left:73%;top:8%;animation-delay:1.1s;}
.star:nth-child(8){left:87%;top:18%;animation-delay:.3s;}
.star:nth-child(9){left:94%;top:7%;animation-delay:1.5s;}

.star:nth-child(10){left:8%;top:32%;animation-delay:.8s;}
.star:nth-child(11){left:19%;top:42%;animation-delay:1.4s;}
.star:nth-child(12){left:31%;top:30%;animation-delay:.2s;}
.star:nth-child(13){left:44%;top:39%;animation-delay:1.2s;}
.star:nth-child(14){left:56%;top:29%;animation-delay:.6s;}
.star:nth-child(15){left:68%;top:40%;animation-delay:1.6s;}
.star:nth-child(16){left:81%;top:31%;animation-delay:.9s;}
.star:nth-child(17){left:93%;top:43%;animation-delay:.2s;}

.star:nth-child(18){left:4%;top:55%;animation-delay:1.3s;}
.star:nth-child(19){left:15%;top:65%;animation-delay:.5s;}
.star:nth-child(20){left:28%;top:57%;animation-delay:1.1s;}
.star:nth-child(21){left:41%;top:68%;animation-delay:.7s;}
.star:nth-child(22){left:55%;top:56%;animation-delay:1.5s;}
.star:nth-child(23){left:69%;top:67%;animation-delay:.4s;}
.star:nth-child(24){left:82%;top:56%;animation-delay:1s;}
.star:nth-child(25){left:94%;top:69%;animation-delay:.6s;}

.star:nth-child(26){left:8%;top:82%;animation-delay:1.2s;}
.star:nth-child(27){left:24%;top:91%;animation-delay:.3s;}
.star:nth-child(28){left:47%;top:84%;animation-delay:1.4s;}
.star:nth-child(29){left:71%;top:91%;animation-delay:.8s;}
.star:nth-child(30){left:91%;top:83%;animation-delay:1.6s;}

@keyframes twinkle{

    0%,100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.25);
    }
}

/* =========================================================
   DESTELLOS
========================================================= */

.sparkle{
    position:absolute;
    z-index:3;

    color:white;
    font-size:30px;

    text-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 20px #ffd83d;

    opacity:0;

    animation:sparkleAppear 2.5s infinite ease-in-out;
}

.sparkle1{
    left:13%;
    top:25%;
    animation-delay:.2s;
}

.sparkle2{
    left:79%;
    top:22%;
    animation-delay:1s;
}

.sparkle3{
    left:7%;
    top:72%;
    animation-delay:1.6s;
}

.sparkle4{
    left:87%;
    top:63%;
    animation-delay:.7s;
}

.sparkle5{
    left:42%;
    top:10%;
    animation-delay:1.8s;
}

.sparkle6{
    left:58%;
    top:80%;
    animation-delay:1.2s;
}

@keyframes sparkleAppear{

    0%,100%{
        opacity:0;
        transform:scale(.4) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.3) rotate(20deg);
    }
}

/* =========================================================
   ESTRELLAS FUGACES
========================================================= */

.shooting-star{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 15px white,
        0 0 25px #ffd83d;

    opacity:0;

    z-index:4;
}

.shooting-star:nth-of-type(1){
    top:20%;
    left:-10%;
    animation:shoot1 6s linear infinite;
}

.shooting-star:nth-of-type(2){
    top:55%;
    left:-10%;
    animation:shoot2 8s linear infinite 3s;
}

@keyframes shoot1{

    0%{
        left:-10%;
        top:20%;
        opacity:0;
    }

    5%{
        opacity:1;
    }

    25%{
        left:110%;
        top:45%;
        opacity:0;
    }

    100%{
        opacity:0;
    }
}

@keyframes shoot2{

    0%{
        left:-10%;
        top:55%;
        opacity:0;
    }

    5%{
        opacity:1;
    }

    25%{
        left:110%;
        top:30%;
        opacity:0;
    }

    100%{
        opacity:0;
    }
}

/* =========================================================
   TITULO
========================================================= */

.title{
    position:relative;
    z-index:8;

    font-weight:900;
    text-align:center;

    line-height:.9;
    letter-spacing:2px;

    text-shadow:
        3px 3px 0 white,
        5px 5px 0 rgba(0,0,0,.2);
}

.abrir{
    position:relative;

    font-size:clamp(55px,15vw,105px);
}

.invitacion{
    font-size:clamp(38px,10vw,72px);
    margin-top:10px;
}

.title span{
    display:inline-block;

    animation:letterFloat 2s infinite ease-in-out;
}

.title .a{
    color:#ef5350;
}

.title .b{
    color:#ffd83d;
}

.title .r{
    color:#42a5f5;
}

.title .i{
    color:#66bb6a;
}

.title .n{
    color:#ff8a65;
}

.title .v{
    color:#ab47bc;
}

.title .t{
    color:#42a5f5;
}

.title .c{
    color:#ffd83d;
}

.title .o{
    color:#ef5350;
}

.title span:nth-child(2){
    animation-delay:.1s;
}

.title span:nth-child(3){
    animation-delay:.2s;
}

.title span:nth-child(4){
    animation-delay:.3s;
}

.title span:nth-child(5){
    animation-delay:.4s;
}

.title span:nth-child(6){
    animation-delay:.5s;
}

.title span:nth-child(7){
    animation-delay:.6s;
}

.title span:nth-child(8){
    animation-delay:.7s;
}

.title span:nth-child(9){
    animation-delay:.8s;
}

.title span:nth-child(10){
    animation-delay:.9s;
}

@keyframes letterFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* =========================================================
   SUBTITULO
========================================================= */

.subtitle{
    position:relative;
    z-index:8;

    margin-top:28px;

    font-size:clamp(17px,5vw,27px);

    font-weight:bold;

    color:white;

    text-align:center;

    text-shadow:
        2px 2px 4px rgba(0,0,0,.5),
        0 0 8px #ffd83d;
}

/* =========================================================
   SEGUNDA PANTALLA
========================================================= */

.toy-screen{
    position:fixed;
    inset:0;

    z-index:5;

    background:#f48fb1;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    opacity:1;

    transition:opacity .5s ease;
}

.invitation-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:0;

    box-shadow:none;
}

/* =========================================================
   UBICACION LILYPAD
========================================================= */

.lilypad-link{
    position:absolute;

    left:35%;
    top:70%;

    width:30%;
    height:17%;

    z-index:20;

    background:transparent;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
    tap-highlight-color:transparent;
}

/* =========================================================
   ESTRELLAS MAGICAS PAGINA 2
========================================================= */

#starContainer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:14;

    pointer-events:none;

    overflow:hidden;
}

.magic-star{
    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    opacity:0;

    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:magicStar 2.8s ease-in-out forwards;
}

.magic-star::before,
.magic-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    background:white;

    transform:translate(-50%,-50%);
}

.magic-star::before{
    width:22px;
    height:2px;
}

.magic-star::after{
    width:2px;
    height:22px;
}

@keyframes magicStar{

    0%{
        opacity:0;
        transform:scale(.2) rotate(0deg);
    }

    25%{
        opacity:1;
        transform:scale(1.2) rotate(45deg);
    }

    70%{
        opacity:1;
        transform:scale(1) rotate(90deg);
    }

    100%{
        opacity:0;
        transform:scale(.2) rotate(180deg);
    }
}

/* =========================================================
   GLOBOS
========================================================= */

#balloonContainer{
    position:absolute;

    inset:0;

    z-index:16;

    pointer-events:none;

    overflow:hidden;
}

.balloon{
    position:absolute;

    z-index:16;

    bottom:-100px;

    width:50px;
    height:62.5px;

    border-radius:50% 50% 45% 45%;

    pointer-events:auto;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    opacity:0;

    animation:balloonUp 7s linear forwards;
}

.balloon::before{
    content:"";

    position:absolute;

    top:8px;
    left:11px;

    width:12px;
    height:17px;

    border-radius:50%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);
}

.balloon::after{
    content:"";

    position:absolute;

    left:50%;

    bottom:-60px;

    width:1px;
    height:60px;

    background:rgba(80,80,80,.7);

    transform:translateX(-50%);
}

@keyframes balloonUp{

    0%{
        bottom:-120px;
        opacity:0;
    }

    8%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        bottom:110vh;
        opacity:0;
    }
}

/* =========================================================
   PARTICULAS AL REVENTAR GLOBO
========================================================= */

.pop-particle{
    position:fixed;

    z-index:40;

    width:7px;
    height:10px;

    border-radius:2px;

    pointer-events:none;

    animation:popParticle .65s ease-out forwards;
}

.pop-burst{
    position:fixed;

    z-index:39;

    width:20px;
    height:20px;

    border:3px solid white;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    animation:popBurst .45s ease-out forwards;

    box-shadow:
        0 0 10px white,
        0 0 20px #ffd83d;
}

@keyframes popParticle{

    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            rotate(360deg)
            scale(.2);
    }
}

@keyframes popBurst{

    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.2);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(4);
    }
}

/* =========================================================
   CONFETI
========================================================= */

.confetti{
    position:fixed;

    z-index:50;

    width:8px;
    height:12px;

    pointer-events:none;

    animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity:0;
    }
}

/* =========================================================
   SERPENTINAS
========================================================= */

.streamer{
    position:fixed;

    z-index:49;

    width:5px;
    height:80px;

    border-radius:5px;

    pointer-events:none;

    animation:streamerFall 3s ease-out forwards;
}

@keyframes streamerFall{

    0%{
        transform:
            translateY(-30px)
            rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(540deg);
        opacity:0;
    }
}

/* =========================================================
   BOTON DE MUSICA
========================================================= */

.music-btn{
    position:fixed;

    right:15px;
    top:15px;

    z-index:60;

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.3);

    font-size:22px;

    cursor:pointer;
}

/* =========================================================
   AJUSTES PARA CELULAR
========================================================= */

@media(max-width:600px){

    .subtitle{
        margin-top:22px;
    }

    .music-btn{
        width:43px;
        height:43px;
        right:12px;
        top:12px;
    }
}

</style>
</head>

<body>

<!-- ========================================================
     MUSICA
========================================================= -->

<audio id="music" loop preload="metadata">
    <source src="Toys Story.mp3" type="audio/mpeg">
</audio>


<!-- ========================================================

========================================================= -->

<div class="toy-screen" id="toyScreen">

<!-- ========================================================

<div class="start-screen" id="startScreen">

    <!-- 30 ESTRELLAS -->

    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>

    <div class="star">★</div>

    <div class="star">★</div>

    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>

    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>


    <!-- DESTELLOS -->

    <div class="sparkle sparkle1">✦</div>
    <div class="sparkle sparkle2">✦</div>
    <div class="sparkle sparkle3">✦</div>
    <div class="sparkle sparkle4">✦</div>
    <div class="sparkle sparkle5">✦</div>
    <div class="sparkle sparkle6">✦</div>

    <div class="shooting-star"></div>

<!-- ========================================================
     BOTON DE MUSICA
========================================================= -->

<button
    class="music-btn"
    id="musicBtn"
    aria-label="Controlar música"
>
    🔇
</button>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const toyScreen =
    document.getElementById("toyScreen");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

const starContainer =
    document.getElementById("starContainer");

const balloonContainer =
    document.getElementById("balloonContainer");


let musicStarted = false;


/* =========================================================
   ABRIR INVITACION + MUSICA
========================================================= */

function openInvitation(){

    /*
       Intentamos reproducir la música directamente
       dentro del gesto del usuario.
    */

    if(music.paused){

        music.volume = 1;

        const playPromise = music.play();

        if(playPromise !== undefined){

            playPromise
            .then(()=>{

                musicStarted = true;

                musicBtn.textContent = "🔊";

            })
            .catch((error)=>{

                console.log(
                    "No se pudo iniciar automáticamente:",
                    error
                );

                musicBtn.textContent = "🔇";

            });

        }

    }


    /* =====================================================
       ABRIR LA INVITACION
    ===================================================== */

    if(startScreen.style.opacity !== "0"){

        startScreen.style.opacity = "0";


        /*
           Confeti y serpentinas
           al abrir la invitación.
        */

        createConfetti();

        createStreamers();


        setTimeout(()=>{

            startScreen.style.display = "none";

        },700);

    }

}


/* =========================================================
   TOQUE PRINCIPAL
========================================================= */

startScreen.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        openInvitation();

    },
    {
        passive:false
    }
);


/* =========================================================
   BOTON DE MUSICA
========================================================= */

musicBtn.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();
        e.stopPropagation();


        if(music.paused){

            music.volume = 1;

            music.play()
            .then(()=>{

                musicStarted = true;

                musicBtn.textContent = "🔊";

            })
            .catch((error)=>{

                console.log(
                    "El navegador no permitió reproducir la música:",
                    error
                );

            });

        }
        else{

            music.pause();

            musicBtn.textContent = "🔇";

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   CONFETI
========================================================= */

function createConfetti(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    for(let i=0;i<45;i++){

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";


        piece.style.left =
            Math.random()*100 + "%";


        piece.style.top =
            (-20-Math.random()*30) + "px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];


        piece.style.transform =
            "rotate("+
            Math.random()*360+
            "deg)";


        piece.style.animationDuration =
            (2.2+Math.random()*1.5)+"s";


        piece.style.animationDelay =
            Math.random()*.5+"s";


        document.body.appendChild(piece);


        setTimeout(()=>{

            piece.remove();

        },4500);

    }

}


/* =========================================================
   SERPENTINAS
========================================================= */

function createStreamers(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    for(let i=0;i<25;i++){

        const streamer =
            document.createElement("div");

        streamer.className =
            "streamer";


        streamer.style.left =
            Math.random()*100 + "%";


        streamer.style.top =
            (-50-Math.random()*50)+"px";


        streamer.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];


        streamer.style.transform =
            "rotate("+
            (-35+Math.random()*70)+
            "deg)";


        streamer.style.animationDuration =
            (2.3+Math.random()*1.4)+"s";


        streamer.style.animationDelay =
            Math.random()*.6+"s";


        document.body.appendChild(streamer);


        setTimeout(()=>{

            streamer.remove();

        },4500);

    }

}


/* =========================================================
   ESTRELLAS MAGICAS PAGINA 2
========================================================= */

function createMagicStar(){

    const star =
        document.createElement("div");

    star.className =
        "magic-star";


    star.style.left =
        (5+Math.random()*90)+"%";


    star.style.top =
        (5+Math.random()*90)+"%";


    star.style.animationDuration =
        (2+Math.random()*1.5)+"s";


    starContainer.appendChild(star);


    setTimeout(()=>{

        star.remove();

    },4000);

}


/*
   Generamos estrellas continuamente.
*/

setInterval(
    createMagicStar,
    700
);


/* =========================================================
   GLOBOS
========================================================= */

const colors = [

    "#ef5350",
    "#ffd83d",
    "#42a5f5",
    "#66bb6a",
    "#ab47bc",
    "#ff8a65",
    "#ec407a"

];


/* =========================================================
   EXPLOTAR GLOBO
========================================================= */

function popBalloon(balloon){

    if(balloon.dataset.popped === "1"){
        return;
    }


    balloon.dataset.popped = "1";


    const rect =
        balloon.getBoundingClientRect();


    const x =
        rect.left + rect.width/2;


    const y =
        rect.top + rect.height/2;


    /*
       Ocultar globo.
    */

    balloon.style.display = "none";


    /* =====================================================
       ANILLO DE EXPLOSION
    ===================================================== */

    const burst =
        document.createElement("div");

    burst.className =
        "pop-burst";


    burst.style.left =
        x+"px";

    burst.style.top =
        y+"px";


    document.body.appendChild(burst);


    setTimeout(()=>{

        burst.remove();

    },600);


    /* =====================================================
       PARTICULAS
    ===================================================== */

    const particleColors = [

        balloon.style.background,
        "#ffffff",
        "#ffd83d",
        "#42a5f5",
        "#ef5350"

    ];


    for(let i=0;i<18;i++){

        const particle =
            document.createElement("div");

        particle.className =
            "pop-particle";


        particle.style.left =
            x+"px";

        particle.style.top =
            y+"px";


        particle.style.background =
            particleColors[
                Math.floor(
                    Math.random()*
                    particleColors.length
                )
            ];


        const angle =
            Math.random()*
            Math.PI*2;


        const distance =
            35+
            Math.random()*70;


        particle.style.setProperty(
            "--dx",
            Math.cos(angle)*distance+"px"
        );


        particle.style.setProperty(
            "--dy",
            Math.sin(angle)*distance+"px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(()=>{

            particle.remove();

        },800);

    }


    setTimeout(()=>{

        balloon.remove();

    },100);

}


/* =========================================================
   CREAR GRUPOS DE GLOBOS
========================================================= */

function createBalloons(){

    /*
       Cada grupo tendrá de 1 a 3 globos.
    */

    const amount =
        Math.floor(Math.random()*3)+1;


    /*
       Copiamos los colores para evitar
       repetir color dentro del mismo grupo.
    */

    const availableColors =
        [...colors];


    for(let i=0;i<amount;i++){

        const balloon =
            document.createElement("div");

        balloon.className =
            "balloon";


        /*
           Posición horizontal aleatoria.
           El movimiento vertical lo realiza
           únicamente la animación CSS.
        */

        balloon.style.left =
            (10+Math.random()*80)+"%";


        /*
           Seleccionar color sin repetir
           dentro del mismo grupo.
        */

        const colorIndex =
            Math.floor(
                Math.random()*
                availableColors.length
            );


        const selectedColor =
            availableColors.splice(
                colorIndex,
                1
            )[0];


        balloon.style.background =
            selectedColor;


        /*
           Tamaño fijo de 50 px.
        */

        balloon.style.width =
            "50px";

        balloon.style.height =
            "62.5px";


        /*
           Duración ligeramente diferente
           para que no suban exactamente igual.
        */

        balloon.style.animationDuration =
            (6.5+Math.random()*2)+"s";


        /*
           Permitir tocar el globo.
        */

        balloon.addEventListener(
            "pointerdown",
            function(e){

                e.preventDefault();

                e.stopPropagation();

                popBalloon(balloon);

            },
            {
                passive:false
            }
        );


        balloonContainer.appendChild(
            balloon
        );


        /*
           Limpieza automática.
        */

        setTimeout(()=>{

            if(balloon.dataset.popped !== "1"){

                balloon.remove();

            }

        },9500);

    }


    /*
       Próximo grupo entre 4 y 6 segundos.
    */

    const nextTime =
        4000+
        Math.random()*2000;


    setTimeout(
        createBalloons,
        nextTime
    );

}


/* =========================================================
   INICIAR GLOBOS
========================================================= */

setTimeout(
    createBalloons,
    3000
);

</script>
