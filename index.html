    .start-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background-image: url("fondo toys story.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .stars {

      inset: 0;

    .star {

    @keyframes brillo {
      0%, 100% {

        transform: scale(0.7) rotate(0);
      }

      50% {

        transform: scale(1.25) rotate(15deg);
      }

    /* TEXTO */
    .titulo {
      position: relative;
      width: 92%;
      max-width: 650px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;

      gap: 3px;

      transform: translateY(-120px);

      animation: tituloFlota 2s ease-in-out infinite;

      z-index: 5;
      text-align: center;
    }

    .letra {
      display: inline-block;

      font-family: "Arial Black", Impact, sans-serif;

      font-size: clamp(35px, 11vw, 82px);

      font-weight: 900;
      line-height: 0.9;

      color: white;

      -webkit-text-stroke: 2px #174c91;

      text-shadow:
        0 3px 0 #174c91,
        3px 5px 0 #e4a900,
        5px 7px 0 #17447f,
        0 0 12px rgba(255,255,255,0.7);

      animation: letraMovimiento 3s ease-in-out infinite;
    }

    .espacio {
      width: 12px;
    }

    @keyframes letraMovimiento {
      0%, 100% {
        transform: rotate(1.5deg);
      }

      50% {
        transform: rotate(-1.5deg);
      }
    }

    @keyframes tituloFlota {
      0%, 100% {
        transform: translateY(-120px);
      }

      50% {
        transform: translateY(-126px);
      }
    }

    /* CONFETI */
    .confetti {
      position: fixed;

      top: calc(50% - 120px);
      left: 50%;

      width: 8px;
      height: 12px;

      z-index: 30;

      pointer-events: none;

      animation:
        confettiExplosion 1.8s ease-out forwards,
        confettiGiro 0.7s linear infinite;
    }

    @keyframes confettiExplosion {

      0% {
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0);

        opacity: 1;
      }

      100% {
        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--r));

        opacity: 0;
      }
    }

    @keyframes confettiGiro {
      from {
        margin-left: -3px;
      }

      to {
        margin-left: 3px;
      }
    }

    /* SEGUNDA PANTALLA */
    .toy-screen {
      position: fixed;
      inset: 0;

      height: 100%;

      background-color: #4da6e8;

      background-image: url("caja juguetes.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 0;

      z-index: 1;

      transition: opacity 0.8s ease;
    }

    .toy-screen.show {
      opacity: 1;
    }

    @media (max-width: 380px) {

      }
    }
  </style>
</head>

  <!-- SEGUNDA PANTALLA -->
  <div class="toy-screen" id="toyScreen"></div>

  <!-- MÚSICA -->
  <audio
    id="music"
    preload="auto"
    playsinline
    src="Toys Story.mp3">
  </audio>


  <script>

    const startScreen = document.getElementById("startScreen");
    const toyScreen = document.getElementById("toyScreen");
    const music = document.getElementById("music");

    let opened = false;


    /* CONFETI */

    function lanzarConfeti() {

      const cantidad = 70;

      const colores = [
        "#ff3b30",
        "#ffd60a",
        "#34c759",
        "#0a84ff",
        "#ff2d55",
        "#af52de",
        "#ffffff"
      ];


      for (let i = 0; i < cantidad; i++) {

        const confetti = document.createElement("span");

        confetti.className = "confetti";

        confetti.style.background =
          colores[Math.floor(Math.random() * colores.length)];


        const angulo =
          Math.random() * Math.PI * 2;

        const distancia =
          150 + Math.random() * 420;


        const x =
          Math.cos(angulo) * distancia;

        const y =
          Math.sin(angulo) * distancia;


        const rotacion =
          Math.random() * 1200 - 600;


        confetti.style.setProperty(
          "--x",
          `${x}px`
        );

        confetti.style.setProperty(
          "--y",
          `${y}px`
        );

        confetti.style.setProperty(
          "--r",
          `${rotacion}deg`
        );


        const tamano =
          6 + Math.random() * 7;


        confetti.style.width =
          `${tamano}px`;

        confetti.style.height =
          `${tamano * 1.5}px`;


        document.body.appendChild(confetti);


        setTimeout(() => {
          confetti.remove();
        }, 2000);

      }

    }


    /* TOCAR EN CUALQUIER PARTE */

    startScreen.addEventListener("click", function () {

      if (opened) return;

      opened = true;


      /* Confeti */
      lanzarConfeti();


      /* Música */
      music.currentTime = 0;

      music.play().catch(function(error) {

        console.log(
          "La música no pudo reproducirse:",
          error
        );

      });


      /* Mostrar segunda pantalla */
      toyScreen.classList.add("show");


      /* Ocultar primera pantalla */
      setTimeout(function () {

        startScreen.classList.add("hidden");

      }, 500);

    });

  </script>
