<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación Toy Story</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#4da6e8;
}


/* =========================
   PANTALLA INICIAL
========================= */

.start-screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;

    background-image:url("fondo toys story.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;

    z-index:10;

    transition:opacity .8s ease, visibility .8s ease;
}

.start-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =========================
   ESTRELLAS
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    color:#fff;
    line-height:1;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffe66d;

    animation:brillo 2.2s ease-in-out infinite;
}

.s1{top:8%;left:7%;font-size:24px;animation-delay:.2s}
.s2{top:18%;right:11%;font-size:14px;animation-delay:1s}
.s3{top:30%;left:4%;font-size:11px;animation-delay:.6s}
.s4{top:42%;right:6%;font-size:25px;animation-delay:1.4s}
.s5{bottom:19%;left:12%;font-size:15px;animation-delay:.9s}
.s6{bottom:11%;right:15%;font-size:19px;animation-delay:1.8s}
.s7{top:8%;right:32%;font-size:10px;animation-delay:.4s}
.s8{bottom:29%;left:4%;font-size:9px;animation-delay:1.2s}
.s9{bottom:9%;right:5%;font-size:12px;animation-delay:.7s}
.s10{top:28%;left:22%;font-size:8px;animation-delay:1.6s}
.s11{top:15%;left:28%;font-size:13px;animation-delay:.5s}
.s12{top:36%;right:23%;font-size:9px;animation-delay:1.3s}
.s13{bottom:25%;right:30%;font-size:14px;animation-delay:.3s}
.s14{bottom:17%;left:30%;font-size:8px;animation-delay:1.7s}
.s15{top:55%;left:14%;font-size:17px;animation-delay:.8s}
.s16{top:59%;right:13%;font-size:10px;animation-delay:1.5s}
.s17{top:13%;left:18%;font-size:9px;animation-delay:.4s}
.s18{top:25%;left:12%;font-size:16px;animation-delay:1.1s}
.s19{top:7%;left:42%;font-size:8px;animation-delay:1.7s}
.s20{top:20%;right:27%;font-size:11px;animation-delay:.7s}
.s21{top:34%;right:14%;font-size:7px;animation-delay:1.9s}
.s22{bottom:34%;left:19%;font-size:10px;animation-delay:.5s}
.s23{bottom:23%;left:42%;font-size:13px;animation-delay:1.3s}
.s24{bottom:31%;right:10%;font-size:8px;animation-delay:.9s}
.s25{top:48%;left:27%;font-size:9px;animation-delay:1.6s}
.s26{bottom:8%;left:35%;font-size:11px;animation-delay:.2s}

@keyframes brillo{
    0%,100%{
        opacity:.3;
        transform:scale(.7) rotate(0);
    }

    50%{
        opacity:1;
        transform:scale(1.25) rotate(15deg);
    }
}


/* =========================
   TEXTO
========================= */

.titulo{
    position:relative;
    width:100%;
    max-width:700px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    transform:translateY(-90px);

    animation:flotar 2.5s ease-in-out infinite;

    z-index:5;
    text-align:center;
}

.palabra{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:0;

    white-space:nowrap;
}

.letra{
    display:block;

    font-family:
        "Arial Black",
        Impact,
        sans-serif;

    font-weight:900;

    font-size:clamp(48px,13vw,90px);

    line-height:.82;

    color:#fff;

    -webkit-text-stroke:
        clamp(2px,.5vw,4px)
        #164b91;

    text-shadow:
        0 3px 0 #164b91,
        0 5px 0 #e4a900,
        0 7px 0 #173f78,
        2px 2px 0 #173f78,
        -1px -1px 0 rgba(255,255,255,.8);

    transform-origin:center bottom;

    animation:movimiento 3s ease-in-out infinite;
}

.palabra:nth-child(1) .letra:nth-child(1){animation-delay:-.1s}
.palabra:nth-child(1) .letra:nth-child(2){animation-delay:-.3s}
.palabra:nth-child(1) .letra:nth-child(3){animation-delay:-.5s}
.palabra:nth-child(1) .letra:nth-child(4){animation-delay:-.7s}
.palabra:nth-child(1) .letra:nth-child(5){animation-delay:-.9s}

.palabra:nth-child(2) .letra:nth-child(1){animation-delay:-1.1s}
.palabra:nth-child(2) .letra:nth-child(2){animation-delay:-1.3s}
.palabra:nth-child(2) .letra:nth-child(3){animation-delay:-1.5s}
.palabra:nth-child(2) .letra:nth-child(4){animation-delay:-1.7s}
.palabra:nth-child(2) .letra:nth-child(5){animation-delay:-1.9s}
.palabra:nth-child(2) .letra:nth-child(6){animation-delay:-2.1s}
.palabra:nth-child(2) .letra:nth-child(7){animation-delay:-2.3s}
.palabra:nth-child(2) .letra:nth-child(8){animation-delay:-2.5s}
.palabra:nth-child(2) .letra:nth-child(9){animation-delay:-2.7s}
.palabra:nth-child(2) .letra:nth-child(10){animation-delay:-2.9s}

@keyframes movimiento{
    0%,100%{
        transform:rotate(1deg);
    }

    50%{
        transform:rotate(-1deg);
    }
}

@keyframes flotar{
    0%,100%{
        transform:translateY(-90px);
    }

    50%{
        transform:translateY(-96px);
    }
}


/* =========================
   CONFETI
========================= */

.confetti{
    position:fixed;

    top:calc(50% - 90px);
    left:50%;

    z-index:30;

    pointer-events:none;

    animation:
        explosion 1.8s ease-out forwards,
        giro .7s linear infinite;
}

@keyframes explosion{

    0%{
        transform:
            translate(-50%,-50%)
            translate(0,0)
            rotate(0);

        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            rotate(var(--r));

        opacity:0;
    }
}

@keyframes giro{

    from{
        margin-left:-3px;
    }

    to{
        margin-left:3px;
    }
}


/* =========================
   SERPENTINAS
========================= */

.serpentina{
    position:fixed;

    top:calc(50% - 90px);
    left:50%;

    width:5px;
    height:75px;

    border-radius:50%;

    z-index:31;

    pointer-events:none;

    transform-origin:top center;

    animation:
        serpentinaExplosion 2.2s ease-out forwards,
        serpentinaGiro .6s ease-in-out infinite;
}


/* Movimiento de salida */
@keyframes serpentinaExplosion{

    0%{
        transform:
            translate(-50%,-50%)
            translate(0,0)
            rotate(0)
            scaleY(.2);

        opacity:1;
    }

    45%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            translate(var(--sx),var(--sy))
            rotate(var(--sr))
            scaleY(1);

        opacity:0;
    }
}


/* Ondulación */
@keyframes serpentinaGiro{

    0%{
        margin-left:-4px;
    }

    50%{
        margin-left:4px;
    }

    100%{
        margin-left:-4px;
    }
}


/* =========================
   SEGUNDA PANTALLA
========================= */

.toy-screen{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background-color:#4da6e8;

    background-image:url("caja juguetes.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;

    z-index:1;

    transition:opacity .8s ease;
}

.toy-screen.show{
    opacity:1;
}


/* =========================
   CELULAR
========================= */

@media(max-width:380px){

    .titulo{
        width:96%;
        gap:4px;

        transform:translateY(-80px);
    }

    .letra{
        font-size:43px;

        -webkit-text-stroke:2px #164b91;

        text-shadow:
            0 2px 0 #164b91,
            0 4px 0 #e4a900,
            0 6px 0 #173f78,
            1px 1px 0 #173f78;
    }

    @keyframes flotar{

        0%,100%{
            transform:translateY(-80px);
        }

        50%{
            transform:translateY(-85px);
        }
    }
}

</style>
</head>


<body>


<!-- SEGUNDA PANTALLA -->

<div
    class="toy-screen"
    id="toyScreen">
</div>


<!-- PANTALLA INICIAL -->

<div
    class="start-screen"
    id="startScreen">


    <!-- ESTRELLAS -->

    <div class="stars">

        <span class="star s1">✦</span>
        <span class="star s2">✦</span>
        <span class="star s3">✦</span>
        <span class="star s4">✦</span>
        <span class="star s5">✦</span>
        <span class="star s6">✦</span>
        <span class="star s7">✦</span>
        <span class="star s8">✦</span>
        <span class="star s9">✦</span>
        <span class="star s10">✦</span>
        <span class="star s11">✦</span>
        <span class="star s12">✦</span>
        <span class="star s13">✦</span>
        <span class="star s14">✦</span>
        <span class="star s15">✦</span>
        <span class="star s16">✦</span>
        <span class="star s17">✦</span>
        <span class="star s18">✦</span>
        <span class="star s19">✦</span>
        <span class="star s20">✦</span>
        <span class="star s21">✦</span>
        <span class="star s22">✦</span>
        <span class="star s23">✦</span>
        <span class="star s24">✦</span>
        <span class="star s25">✦</span>
        <span class="star s26">✦</span>

    </div>


    <!-- TEXTO -->

    <div class="titulo">


        <!-- ABRIR -->

        <div class="palabra">

            <span class="letra">A</span>
            <span class="letra">B</span>
            <span class="letra">R</span>
            <span class="letra">I</span>
            <span class="letra">R</span>

        </div>


        <!-- INVITACIÓN -->

        <div class="palabra">

            <span class="letra">I</span>
            <span class="letra">N</span>
            <span class="letra">V</span>
            <span class="letra">I</span>
            <span class="letra">T</span>
            <span class="letra">A</span>
            <span class="letra">C</span>
            <span class="letra">I</span>
            <span class="letra">Ó</span>
            <span class="letra">N</span>

        </div>

    </div>

</div>


<!-- MÚSICA -->

<audio
    id="music"
    preload="auto"
    playsinline
    src="Toys Story.mp3">
</audio>


<script>


const startScreen =
    document.getElementById("startScreen");

const toyScreen =
    document.getElementById("toyScreen");

const music =
    document.getElementById("music");

let opened = false;


/* =========================
   CONFETI
========================= */

function lanzarConfeti(){

    const cantidad = 70;

    const colores = [
        "#ff3b30",
        "#ffd60a",
        "#34c759",
        "#0a84ff",
        "#ff2d55",
        "#af52de",
        "#ffffff"
    ];


    for(let i=0;i<cantidad;i++){

        const confetti =
            document.createElement("span");


        confetti.className =
            "confetti";


        confetti.style.background =
            colores[
                Math.floor(
                    Math.random()*colores.length
                )
            ];


        const angulo =
            Math.random()*Math.PI*2;


        const distancia =
            150 + Math.random()*420;


        const x =
            Math.cos(angulo)*distancia;


        const y =
            Math.sin(angulo)*distancia;


        const rotacion =
            Math.random()*1200-600;


        confetti.style.setProperty(
            "--x",
            `${x}px`
        );


        confetti.style.setProperty(
            "--y",
            `${y}px`
        );


        confetti.style.setProperty(
            "--r",
            `${rotacion}deg`
        );


        const tamano =
            6 + Math.random()*7;


        confetti.style.width =
            `${tamano}px`;


        confetti.style.height =
            `${tamano*1.5}px`;


        document.body.appendChild(
            confetti
        );


        setTimeout(
            ()=>confetti.remove(),
            2000
        );

    }

}


/* =========================
   SERPENTINAS
========================= */

function lanzarSerpentinas(){

    const cantidad = 25;

    const colores = [
        "#ff3b30",
        "#ffd60a",
        "#34c759",
        "#0a84ff",
        "#ff2d55",
        "#af52de",
        "#ff9500"
    ];


    for(let i=0;i<cantidad;i++){

        const serpentina =
            document.createElement("span");


        serpentina.className =
            "serpentina";


        serpentina.style.background =
            colores[
                Math.floor(
                    Math.random()*colores.length
                )
            ];


        /* Dirección */
        const angulo =
            Math.random()*Math.PI*2;


        const distancia =
            180 + Math.random()*380;


        const x =
            Math.cos(angulo)*distancia;


        const y =
            Math.sin(angulo)*distancia;


        const rotacion =
            Math.random()*720-360;


        serpentina.style.setProperty(
            "--sx",
            `${x}px`
        );


        serpentina.style.setProperty(
            "--sy",
            `${y}px`
        );


        serpentina.style.setProperty(
            "--sr",
            `${rotacion}deg`
        );


        /* Tamaño aleatorio */

        serpentina.style.width =
            `${3 + Math.random()*4}px`;


        serpentina.style.height =
            `${55 + Math.random()*75}px`;


        /* Curvatura visual */

        serpentina.style.borderRadius =
            `${20 + Math.random()*30}px`;


        document.body.appendChild(
            serpentina
        );


        setTimeout(
            ()=>serpentina.remove(),
            2400
        );

    }

}


/* =========================
   TOCAR CUALQUIER PARTE
========================= */

startScreen.addEventListener(
    "click",
    function(){

        if(opened) return;

        opened = true;


        /* CONFETI */
        lanzarConfeti();


        /* SERPENTINAS */
        lanzarSerpentinas();


        /* MÚSICA */

        music.currentTime = 0;

        music.play().catch(
            error => {

                console.log(
                    "No se pudo reproducir la música:",
                    error
                );

            }
        );


        /* SEGUNDA PANTALLA */

        toyScreen.classList.add(
            "show"
        );


        /* OCULTAR PRIMERA */

        setTimeout(
            ()=>{

                startScreen.classList.add(
                    "hidden"
                );

            },
            500
        );

    }
);

</script>

</body>
</html>
