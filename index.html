<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Invitación</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* =========================
   PRIMERA PANTALLA
========================= */

.start-screen{
    position:fixed;
    inset:0;
    z-index:10;
    background-image:url("fondo toys story.png");
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    opacity:1;
    transition:opacity .7s ease;
    overflow:hidden;
}

/* =========================
   ESTRELLAS
========================= */

.star{
    position:absolute;
    z-index:2;
    color:white;
    font-size:22px;
    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;
    animation:twinkle 2s infinite ease-in-out;
}

.star:nth-child(1){left:5%;top:10%;animation-delay:.1s;}
.star:nth-child(2){left:15%;top:22%;animation-delay:.7s;}
.star:nth-child(3){left:25%;top:8%;animation-delay:1.2s;}
.star:nth-child(4){left:35%;top:18%;animation-delay:.4s;}
.star:nth-child(5){left:45%;top:7%;animation-delay:1.5s;}
.star:nth-child(6){left:55%;top:15%;animation-delay:.9s;}
.star:nth-child(7){left:65%;top:6%;animation-delay:1.8s;}
.star:nth-child(8){left:75%;top:20%;animation-delay:.3s;}
.star:nth-child(9){left:88%;top:10%;animation-delay:1.1s;}
.star:nth-child(10){left:93%;top:28%;animation-delay:.6s;}

.star:nth-child(11){left:8%;top:38%;animation-delay:1.4s;}
.star:nth-child(12){left:20%;top:45%;animation-delay:.2s;}
.star:nth-child(13){left:32%;top:35%;animation-delay:1.7s;}
.star:nth-child(14){left:48%;top:40%;animation-delay:.8s;}
.star:nth-child(15){left:60%;top:32%;animation-delay:1.3s;}
.star:nth-child(16){left:72%;top:42%;animation-delay:.5s;}
.star:nth-child(17){left:84%;top:37%;animation-delay:1.9s;}

.star:nth-child(18){left:4%;top:58%;animation-delay:.9s;}
.star:nth-child(19){left:16%;top:68%;animation-delay:1.6s;}
.star:nth-child(20){left:29%;top:58%;animation-delay:.4s;}
.star:nth-child(21){left:43%;top:70%;animation-delay:1.2s;}
.star:nth-child(22){left:57%;top:60%;animation-delay:.7s;}
.star:nth-child(23){left:70%;top:68%;animation-delay:1.8s;}
.star:nth-child(24){left:82%;top:58%;animation-delay:.3s;}
.star:nth-child(25){left:94%;top:72%;animation-delay:1.5s;}

.star:nth-child(26){left:10%;top:85%;animation-delay:.6s;}
.star:nth-child(27){left:27%;top:90%;animation-delay:1.3s;}
.star:nth-child(28){left:48%;top:84%;animation-delay:.2s;}
.star:nth-child(29){left:68%;top:90%;animation-delay:1.7s;}
.star:nth-child(30){left:90%;top:86%;animation-delay:.8s;}

@keyframes twinkle{
    0%,100%{
        transform:scale(.7) rotate(0deg);
        opacity:.4;
    }

    50%{
        transform:scale(1.25) rotate(20deg);
        opacity:1;
    }
}

/* =========================
   DESTELLOS
========================= */

.sparkle{
    position:absolute;
    z-index:3;
    color:white;
    font-size:30px;
    text-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 20px #ffd83d;
    opacity:0;
    animation:sparkleAppear 2.5s infinite ease-in-out;
}

.sparkle1{
    left:12%;
    top:30%;
    animation-delay:.3s;
}

.sparkle2{
    left:78%;
    top:25%;
    animation-delay:1s;
}

.sparkle3{
    left:88%;
    top:50%;
    animation-delay:1.7s;
}

.sparkle4{
    left:20%;
    top:72%;
    animation-delay:.6s;
}

.sparkle5{
    left:62%;
    top:78%;
    animation-delay:1.4s;
}

.sparkle6{
    left:42%;
    top:27%;
    animation-delay:2s;
}

@keyframes sparkleAppear{
    0%,100%{
        opacity:0;
        transform:scale(.3) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.2) rotate(45deg);
    }
}

/* =========================
   ESTRELLAS FUGACES
========================= */

.shooting-star{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 8px white,
        0 0 15px white,
        0 0 25px #ffd83d;
    opacity:0;
    z-index:4;
}

.shooting-star::after{
    content:"";
    position:absolute;
    right:0;
    top:50%;
    width:90px;
    height:2px;
    background:linear-gradient(
        to left,
        rgba(255,255,255,.9),
        transparent
    );
    transform:translateY(-50%);
}

.shooting1{
    left:-10%;
    top:25%;
    animation:shooting 5s linear infinite;
    animation-delay:1s;
}

.shooting2{
    left:-10%;
    top:55%;
    animation:shooting 6s linear infinite;
    animation-delay:4s;
}

@keyframes shooting{
    0%{
        left:-10%;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    45%{
        opacity:1;
    }

    55%,100%{
        left:110%;
        opacity:0;
    }
}

/* =========================
   TITULO
========================= */

.title{
    position:relative;
    z-index:8;
    font-weight:900;
    text-align:center;
    line-height:.9;
    letter-spacing:2px;
    text-shadow:
        3px 3px 0 white,
        5px 5px 0 rgba(0,0,0,.2);
}

.abrir{
    position:relative;
    font-size:clamp(55px,15vw,105px);
}

.invitacion{
    font-size:clamp(38px,10vw,72px);
    margin-top:10px;
}

.title span{
    display:inline-block;
    animation:letterFloat 2s infinite ease-in-out;
}

.title .a{color:#ef5350;}
.title .b{color:#ffd83d;}
.title .r{color:#42a5f5;}
.title .i{color:#66bb6a;}

.title .n{color:#ff8a65;}
.title .v{color:#ab47bc;}
.title .t{color:#42a5f5;}
.title .c{color:#ffd83d;}
.title .o{color:#ef5350;}

@keyframes letterFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* =========================
   SUBTITULO
========================= */

.subtitle{
    position:relative;
    z-index:8;
    margin-top:25px;
    padding:10px 20px;
    border-radius:30px;
    background:white;
    border:4px solid #173d70;
    color:#173d70;
    font-size:clamp(15px,4vw,22px);
    font-weight:bold;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    animation:subtitleFloat 2.5s infinite ease-in-out;
}

@keyframes subtitleFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

/* =========================
   SEGUNDA PANTALLA
========================= */

.toy-screen{
    position:fixed;
    inset:0;
    z-index:5;
    background:#f48fb1;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    opacity:1;
    transition:opacity .5s ease;
}

.invitation-image{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    border-radius:0;
    box-shadow:none;
}

/* =========================
   UBICACION GOOGLE MAPS
========================= */

.lilypad-link{
    position:absolute;
    left:35%;
    top:70%;
    width:30%;
    height:17%;
    z-index:20;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    tap-highlight-color:transparent;
}

/* =========================
   ESTRELLAS MAGICAS
========================= */

#starContainer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:14;
    pointer-events:none;
    overflow:hidden;
}

.magic-star{
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    opacity:0;
    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;
    animation:magicStar 2.8s ease-in-out forwards;
}

.magic-star::before,
.magic-star::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    background:white;
    transform:translate(-50%,-50%);
}

.magic-star::before{
    width:22px;
    height:2px;
}

.magic-star::after{
    width:2px;
    height:22px;
}

@keyframes magicStar{
    0%{
        opacity:0;
        transform:scale(.2) rotate(0deg);
    }

    25%{
        opacity:.5;
        transform:scale(.7) rotate(30deg);
    }

    50%{
        opacity:1;
        transform:scale(1.4) rotate(45deg);
    }

    70%{
        opacity:.8;
        transform:scale(1) rotate(60deg);
    }

    100%{
        opacity:0;
        transform:scale(.2) rotate(90deg);
    }
}

/* =========================
   GLOBOS
========================= */

#balloonContainer{
    position:absolute;
    inset:0;
    z-index:16;
    pointer-events:none;
    overflow:hidden;
}

.balloon{
    position:absolute;
    z-index:16;
    bottom:-100px;

    /* GLOBOS DE 50 PX */
    width:50px;
    height:62.5px;

    border-radius:50% 50% 45% 45%;
    pointer-events:auto;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:0;
    animation:balloonUp 7s linear forwards;
}

.balloon::before{
    content:"";
    position:absolute;
    top:8px;
    left:11px;
    width:12px;
    height:17px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:rotate(25deg);
}

.balloon::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-60px;
    width:1px;
    height:60px;
    background:rgba(80,80,80,.7);
    transform:translateX(-50%);
}

@keyframes balloonUp{
    0%{
        bottom:-120px;
        opacity:0;
    }

    8%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        bottom:110vh;
        opacity:0;
    }
}

/* =========================
   EXPLOSION
========================= */

.pop-particle{
    position:fixed;
    z-index:40;
    width:7px;
    height:10px;
    border-radius:2px;
    pointer-events:none;
    animation:popParticle .65s ease-out forwards;
}

@keyframes popParticle{
    0%{
        transform:translate(0,0) scale(1) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translate(var(--dx),var(--dy))
            scale(.3)
            rotate(360deg);
        opacity:0;
    }
}

.pop-burst{
    position:fixed;
    z-index:39;
    width:20px;
    height:20px;
    border:3px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    animation:popBurst .45s ease-out forwards;
    box-shadow:
        0 0 10px white,
        0 0 20px #ffd83d;
}

@keyframes popBurst{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.3);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(3);
    }
}

/* =========================
   CONFETI
========================= */

.confetti{
    position:fixed;
    z-index:50;
    width:8px;
    height:12px;
    pointer-events:none;
    animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{
    0%{
        transform:
            translateY(-20px)
            rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity:0;
    }
}

/* =========================
   SERPENTINAS
========================= */

.streamer{
    position:fixed;
    z-index:49;
    width:5px;
    height:80px;
    border-radius:5px;
    pointer-events:none;
    animation:streamerFall 3s ease-out forwards;
}

@keyframes streamerFall{
    0%{
        transform:
            translateY(-100px)
            rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity:0;
    }
}

/* =========================
   BOTON MUSICA
========================= */

.music-btn{
    position:fixed;
    right:15px;
    top:15px;
    z-index:60;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.3);
    font-size:22px;
    cursor:pointer;
}

</style>
</head>

<script>

/* =========================
   ELEMENTOS
========================= */

const startScreen =
    document.getElementById("startScreen");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

const balloonContainer =
    document.getElementById("balloonContainer");

const starContainer =
    document.getElementById("starContainer");


/* =========================
   COLORES
========================= */

const colors = [
    "#ef5350",
    "#ffd83d",
    "#42a5f5",
    "#66bb6a",
    "#ab47bc",
    "#ff8a65",
    "#ec407a"
];


/* =========================
   CONTROL DE MUSICA
========================= */

let musicStarted = false;


/* =========================
   ABRIR INVITACION
========================= */

startScreen.addEventListener(
    "pointerdown",
    function(){

        if(startScreen.style.opacity !== "0"){

            startScreen.style.opacity="0";

            /*
             * La música solamente se intenta
             * iniciar UNA vez.
             */
            if(!musicStarted){

                musicStarted=true;

                music.currentTime=0;

                const playPromise =
                    music.play();

                if(playPromise !== undefined){

                    playPromise.catch(()=>{
                        musicStarted=false;
                    });

                }

            }

            createConfetti();
            createStreamers();

            setTimeout(()=>{

                startScreen.style.display="none";

            },700);

        }

    },
    {once:true}
);


/* =========================
   BOTON MUSICA
========================= */

musicBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        if(music.paused){

            music.play().then(()=>{

                musicStarted=true;
                musicBtn.textContent="🔊";

            }).catch(()=>{});

        }else{

            music.pause();

            musicBtn.textContent="🔇";

        }

    }
);


/* =========================
   CONFETI
========================= */

function createConfetti(){

    for(let i=0;i<70;i++){

        const piece =
            document.createElement("div");

        piece.className="confetti";

        piece.style.left =
            Math.random()*100+"%";

        piece.style.top =
            (-10-Math.random()*30)+"%";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        piece.style.animationDelay =
            Math.random()*1.5+"s";

        piece.style.transform =
            "rotate("+Math.random()*360+"deg)";

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },4500);

    }

}


/* =========================
   SERPENTINAS
========================= */

function createStreamers(){

    for(let i=0;i<25;i++){

        const streamer =
            document.createElement("div");

        streamer.className="streamer";

        streamer.style.left =
            Math.random()*100+"%";

        streamer.style.top =
            (-100-Math.random()*100)+"px";

        streamer.style.height =
            (50+Math.random()*80)+"px";

        streamer.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        streamer.style.animationDelay =
            Math.random()*1.2+"s";

        document.body.appendChild(streamer);

        setTimeout(()=>{
            streamer.remove();
        },4500);

    }

}


/* =========================
   ESTRELLAS MAGICAS
========================= */

function createMagicStars(){

    const amount =
        Math.floor(Math.random()*3)+1;

    for(let i=0;i<amount;i++){

        const star =
            document.createElement("div");

        star.className="magic-star";

        star.style.left =
            (5+Math.random()*90)+"%";

        star.style.top =
            (5+Math.random()*85)+"%";

        star.style.animationDelay =
            Math.random()*.5+"s";

        starContainer.appendChild(star);

        setTimeout(()=>{
            star.remove();
        },3200);

    }

    const nextTime =
        1500+Math.random()*1500;

    setTimeout(
        createMagicStars,
        nextTime
    );

}


/* =========================
   GLOBOS
========================= */

function createBalloons(){

    /*
     * 1, 2 o 3 globos
     */
    const amount =
        Math.floor(Math.random()*3)+1;

    /*
     * Copia de colores para que
     * no se repita ninguno dentro
     * del mismo grupo.
     */
    const availableColors =
        [...colors];

    for(let i=0;i<amount;i++){

        const balloon =
            document.createElement("div");

        balloon.className="balloon";

        balloon.style.left =
            (10+Math.random()*80)+"%";


        /* COLOR SIN REPETIR */

        const colorIndex =
            Math.floor(
                Math.random()*
                availableColors.length
            );

        const selectedColor =
            availableColors.splice(
                colorIndex,
                1
            )[0];

        balloon.style.background =
            selectedColor;


        /*
         * TAMAÑO:
         * 50 PX EXACTOS
         */

        balloon.style.width="50px";

        balloon.style.height="62.5px";


        /*
         * VELOCIDAD
         */

        balloon.style.animationDuration =
            (6.5+Math.random()*2)+"s";


        /*
         * EXPLOTAR AL TOCAR
         */

        balloon.addEventListener(
            "pointerdown",
            function(e){

                e.preventDefault();
                e.stopPropagation();

                popBalloon(balloon);

            }
        );


        balloonContainer.appendChild(
            balloon
        );


        /*
         * ELIMINACION AUTOMATICA
         */

        setTimeout(()=>{

            if(
                balloon.dataset.popped!=="1"
            ){

                balloon.remove();

            }

        },9500);

    }


    /*
     * NUEVO GRUPO:
     * ENTRE 4 Y 6 SEGUNDOS
     */

    const nextTime =
        4000+Math.random()*2000;

    setTimeout(
        createBalloons,
        nextTime
    );

}


/* =========================
   EXPLOSION DEL GLOBO
========================= */

function popBalloon(balloon){

    if(
        !balloon ||
        balloon.dataset.popped==="1"
    ){
        return;
    }

    balloon.dataset.popped="1";


    const rect =
        balloon.getBoundingClientRect();

    const x =
        rect.left+rect.width/2;

    const y =
        rect.top+rect.height/2;


    /* OCULTAR GLOBO */

    balloon.style.animation="none";

    balloon.style.transition =
        "transform .12s ease, opacity .12s ease";

    balloon.style.transform =
        "scale(1.35)";

    balloon.style.opacity="0";


    /* COLORES DE PARTICULAS */

    const particleColors = [
        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"
    ];


    /* PARTICULAS */

    for(let i=0;i<14;i++){

        const piece =
            document.createElement("div");

        piece.className="pop-particle";

        piece.style.left =
            x+"px";

        piece.style.top =
            y+"px";

        piece.style.background =
            particleColors[
                Math.floor(
                    Math.random()*
                    particleColors.length
                )
            ];

        piece.style.setProperty(
            "--dx",
            (Math.random()*120-60)+"px"
        );

        piece.style.setProperty(
            "--dy",
            (Math.random()*120-60)+"px"
        );

        piece.style.transform =
            "rotate("+
            Math.random()*360+
            "deg)";

        document.body.appendChild(
            piece
        );

        setTimeout(()=>{
            piece.remove();
        },700);

    }


    /* CIRCULO DE EXPLOSION */

    const burst =
        document.createElement("div");

    burst.className="pop-burst";

    burst.style.left =
        x+"px";

    burst.style.top =
        y+"px";

    document.body.appendChild(
        burst
    );

    setTimeout(()=>{
        burst.remove();
    },500);


    setTimeout(()=>{
        balloon.remove();
    },150);

}


/* =========================
   INICIAR EFECTOS
========================= */

createMagicStars();

createBalloons();

</script>

</body>
</html>
