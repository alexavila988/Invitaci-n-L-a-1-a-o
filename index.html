<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Toy Story</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* =========================================
   PRIMERA PANTALLA
========================================= */

.start-screen{
    position:fixed;
    inset:0;
    z-index:10;

    background-image:url("fondo toys story.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    overflow:hidden;
    cursor:pointer;
}


/* =========================================
   30 ESTRELLAS
========================================= */

.star{
    position:absolute;
    z-index:2;

    color:white;
    font-size:22px;

    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:twinkle 2s infinite ease-in-out;
}

.star:nth-child(20){font-size:17px;}

.star:nth-child(21){font-size:26px;}
.star:nth-child(22){font-size:18px;}
.star:nth-child(23){font-size:24px;}
.star:nth-child(24){font-size:16px;}
.star:nth-child(25){font-size:27px;}

.star:nth-child(26){font-size:20px;}
.star:nth-child(27){font-size:25px;}
.star:nth-child(28){font-size:17px;}
.star:nth-child(29){font-size:29px;}
.star:nth-child(30){font-size:19px;}


/* Posiciones */

.star:nth-child(1){top:5%;left:8%;animation-delay:.1s;}
.star:nth-child(2){top:9%;left:28%;animation-delay:.5s;}
.star:nth-child(3){top:6%;right:14%;animation-delay:1s;}
.star:nth-child(4){top:16%;right:4%;animation-delay:1.4s;}

.star:nth-child(21){top:77%;left:18%;animation-delay:1.1s;}
.star:nth-child(22){top:75%;right:29%;animation-delay:.7s;}
.star:nth-child(23){top:82%;right:7%;animation-delay:1.4s;}
.star:nth-child(24){top:87%;left:9%;animation-delay:.3s;}
.star:nth-child(25){top:91%;left:32%;animation-delay:1.6s;}

.star:nth-child(26){top:88%;right:20%;animation-delay:.8s;}
.star:nth-child(27){top:94%;right:5%;animation-delay:1.2s;}
.star:nth-child(28){top:12%;left:48%;animation-delay:.4s;}
.star:nth-child(29){top:35%;left:88%;animation-delay:1.5s;}
.star:nth-child(30){top:58%;left:90%;animation-delay:.9s;}


@keyframes twinkle{

    0%,100%{
        transform:scale(.7) rotate(0deg);
        opacity:.4;
    }

    50%{
        transform:scale(1.25) rotate(20deg);
        opacity:1;
    }

}


/* =========================================
   DESTELLOS PEQUEÑOS
========================================= */

.sparkle{
    position:absolute;
    z-index:4;

    color:white;
    font-size:14px;

    text-shadow:
        0 0 5px white,
        0 0 10px #ffd83d;

    opacity:0;

    animation:sparkleAppear 2.8s ease-in-out infinite;
}


.sparkle1{
    top:29%;
    left:30%;
    animation-delay:.4s;
}

.sparkle2{
    top:34%;
    right:28%;
    animation-delay:1.2s;
}

.sparkle3{
    top:47%;
    left:25%;
    animation-delay:2s;
}

.sparkle4{
    top:48%;
    right:23%;
    animation-delay:.8s;
}

.sparkle5{
    top:58%;
    left:34%;
    animation-delay:1.6s;
}

.sparkle6{
    top:57%;
    right:34%;
    animation-delay:2.4s;
}


@keyframes sparkleAppear{

    0%,100%{
        opacity:0;
        transform:scale(.3) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.2) rotate(45deg);
    }

}


/* =========================================
   ESTRELLAS FUGACES
========================================= */

.shooting-star{
    position:absolute;
    z-index:3;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 20px #ffd83d;

    opacity:0;

    transform:rotate(-35deg);
}


.shooting-star::after{
    content:"";

    position:absolute;

    top:50%;
    right:3px;

    width:90px;
    height:2px;

    transform:translateY(-50%);

    background:linear-gradient(
        to left,
        rgba(255,255,255,.9),
        rgba(255,255,255,0)
    );
}


.shooting1{
    top:18%;
    left:-100px;

    animation:shooting 8s linear infinite;
    animation-delay:3s;
}


.shooting2{
    top:32%;
    left:-100px;

    animation:shooting 9s linear infinite;
    animation-delay:7s;
}


@keyframes shooting{

    0%{
        left:-100px;
        opacity:0;
    }

    5%{
        opacity:1;
    }

    20%{
        left:110%;
        opacity:0;
    }

    100%{
        left:110%;
        opacity:0;
    }

}


/* =========================================
   TÍTULO
========================================= */

.title{
    position:relative;
    z-index:5;

    font-family:Impact,"Arial Black",sans-serif;

    font-weight:900;
    text-transform:uppercase;

    line-height:.9;
    letter-spacing:1px;

    text-shadow:
        4px 4px 0 #173b70,
        -2px -2px 0 #173b70,
        2px -2px 0 #173b70,
        -2px 2px 0 #173b70;

    display:flex;
    justify-content:center;
}


.title span{
    display:inline-block;
    transform-origin:top center;
}


/* =========================================
   MOVIMIENTO INDEPENDIENTE DE CADA LETRA
========================================= */

.abrir span:nth-child(1){
    animation:letter1 3.2s ease-in-out infinite;
}

.abrir span:nth-child(2){
    animation:letter2 2.7s ease-in-out infinite;
}

.abrir span:nth-child(3){
    animation:letter3 3.6s ease-in-out infinite;
}

.abrir span:nth-child(4){
    animation:letter4 2.9s ease-in-out infinite;
}

.abrir span:nth-child(5){
    animation:letter5 3.4s ease-in-out infinite;
}


/* INVITACIÓN */

.invitacion span:nth-child(1){
    animation:letter2 3.1s ease-in-out infinite;
}

.invitacion span:nth-child(2){
    animation:letter5 2.8s ease-in-out infinite;
}

.invitacion span:nth-child(3){
    animation:letter1 3.5s ease-in-out infinite;
}

.invitacion span:nth-child(4){
    animation:letter4 2.6s ease-in-out infinite;
}

.invitacion span:nth-child(5){
    animation:letter3 3.3s ease-in-out infinite;
}

.invitacion span:nth-child(6){
    animation:letter5 2.9s ease-in-out infinite;
}

.invitacion span:nth-child(7){
    animation:letter2 3.7s ease-in-out infinite;
}

.invitacion span:nth-child(8){
    animation:letter1 2.8s ease-in-out infinite;
}

.invitacion span:nth-child(9){
    animation:letter4 3.4s ease-in-out infinite;
}

.invitacion span:nth-child(10){
    animation:letter3 2.7s ease-in-out infinite;
}


/* =========================================
   MOVIMIENTOS
========================================= */

@keyframes letter1{

    0%,100%{
        transform:rotate(-5deg) translateY(0);
    }

    25%{
        transform:rotate(1deg) translateY(3px);
    }

    50%{
        transform:rotate(6deg) translateY(7px);
    }

    75%{
        transform:rotate(0deg) translateY(2px);
    }
}


@keyframes letter2{

    0%,100%{
        transform:rotate(4deg) translateY(2px);
    }

    25%{
        transform:rotate(-4deg) translateY(6px);
    }

    50%{
        transform:rotate(-7deg) translateY(1px);
    }

    75%{
        transform:rotate(2deg) translateY(5px);
    }
}


@keyframes letter3{

    0%,100%{
        transform:rotate(-2deg) translateY(5px);
    }

    25%{
        transform:rotate(6deg) translateY(1px);
    }

    50%{
        transform:rotate(-5deg) translateY(8px);
    }

    75%{
        transform:rotate(3deg) translateY(3px);
    }
}


@keyframes letter4{

    0%,100%{
        transform:rotate(6deg) translateY(1px);
    }

    25%{
        transform:rotate(0deg) translateY(7px);
    }

    50%{
        transform:rotate(-6deg) translateY(3px);
    }

    75%{
        transform:rotate(4deg) translateY(8px);
    }
}


@keyframes letter5{

    0%,100%{
        transform:rotate(-4deg) translateY(4px);
    }

    25%{
        transform:rotate(7deg) translateY(0);
    }

    50%{
        transform:rotate(2deg) translateY(8px);
    }

    75%{
        transform:rotate(-7deg) translateY(2px);
    }
}


/* =========================================
   TAMAÑOS DEL TÍTULO
========================================= */

.abrir{
    position:relative;
    font-size:clamp(55px,15vw,105px);
}


.invitacion{
    font-size:clamp(38px,10vw,72px);
    margin-top:10px;
}


/* =========================================
   COLORES
========================================= */

.title .a{
    color:#ef5350;
}

.title .b{
    color:#ffd83d;
}

.title .r{
    color:#42a5f5;
}

.title .i{
    color:#66bb6a;
}

.title .n{
    color:#ff8a65;
}

.title .v{
    color:#ab47bc;
}

.title .t{
    color:#42a5f5;
}

.title .c{
    color:#ffd83d;
}

.title .o{
    color:#ef5350;
}


/* =========================================
   BRILLO DE ABRIR
========================================= */

.abrir::after{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:-25%;

    width:18%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.95),
        transparent
    );

    transform:skewX(-20deg);

    opacity:0;

    pointer-events:none;

    animation:shineTitle 6s ease-in-out infinite;
}


@keyframes shineTitle{

    0%,65%{
        left:-25%;
        opacity:0;
    }

    70%{
        opacity:1;
    }

    85%{
        left:110%;
        opacity:1;
    }

    90%,100%{
        left:110%;
        opacity:0;
    }
}


/* =========================================
   BURBUJA
========================================= */

.subtitle{

    position:relative;
    z-index:5;

    margin-top:30px;

    background:white;

    color:#173b70;

    padding:12px 22px;

    border:4px solid #173b70;

    border-radius:22px;

    font-size:clamp(15px,4vw,23px);

    font-weight:bold;

    box-shadow:
        4px 5px 0 rgba(23,59,112,.25);

    animation:bubbleFloat 3s ease-in-out infinite;
}


.subtitle::after{

    content:"";

    position:absolute;

    bottom:-15px;

    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;

    border-top:16px solid #173b70;
}


.subtitle::before{

    content:"";

    position:absolute;

    bottom:-9px;

    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    z-index:2;

    border-left:9px solid transparent;
    border-right:9px solid transparent;

    border-top:12px solid white;
}


@keyframes bubbleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* =========================================
   SEGUNDA PÁGINA
   IMAGEN: pagina 2.png
========================================= */

.toy-screen{

    position:fixed;
    inset:0;
    z-index:5;

    background:#f48fb1;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    opacity:1;

    transition:opacity .5s ease;
}


.invitation-image{

    width:100vw;
    height:100vh;

    max-width:none;
    max-height:none;

    object-fit:contain;

    border-radius:0;

    box-shadow:none;

    display:block;
}


/* =========================================
   CLASE OPCIONAL COVER
========================================= */

.invitation-image.cover{
    object-fit:cover;
}


/* =========================================
   CONFETI
========================================= */

.confetti{

    position:fixed;

    z-index:30;

    width:9px;
    height:14px;

    pointer-events:none;

    animation:
        confettiFall 2.5s linear forwards;
}


@keyframes confettiFall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(720deg);

        opacity:0;
    }
}


/* =========================================
   SERPENTINAS
========================================= */

.streamer{

    position:fixed;

    z-index:29;

    width:7px;
    height:90px;

    border-radius:50%;

    pointer-events:none;

    animation:
        streamerFall 3s ease-in forwards;
}


@keyframes streamerFall{

    0%{
        transform:
            translateY(-100px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(540deg);

        opacity:0;
    }
}


/* =========================================
   BOTÓN DE MÚSICA
========================================= */

.music-btn{

    position:fixed;

    z-index:50;

    right:15px;
    bottom:15px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:3px solid #173b70;

    background:white;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.25);
}


/* =========================================
   MÓVIL
========================================= */

@media(max-width:600px){

    .star{
        font-size:18px;
    }

    .sparkle{
        font-size:12px;
    }

    .subtitle{
        margin-top:25px;
        padding:10px 17px;
    }

}

</style>
</head>


<body>


<!-- =========================================
     PRIMERA PANTALLA
========================================= -->

<div class="start-screen" id="startScreen">


    <!-- 30 ESTRELLAS -->

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>

    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>

    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>

    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>


    <!-- DESTELLOS -->

    <span class="sparkle sparkle1">✦</span>
    <span class="sparkle sparkle2">✦</span>
    <span class="sparkle sparkle3">✦</span>
    <span class="sparkle sparkle4">✦</span>
    <span class="sparkle sparkle5">✦</span>
    <span class="sparkle sparkle6">✦</span>


    <!-- ESTRELLAS FUGACES -->

    <div class="shooting-star shooting1"></div>
    <div class="shooting-star shooting2"></div>


    <!-- ABRIR -->

    <div class="title abrir">

        <span class="a">A</span>
        <span class="b">B</span>
        <span class="r">R</span>
        <span class="i">I</span>
        <span class="r">R</span>

    </div>


    <!-- INVITACIÓN -->

    <div class="title invitacion">

        <span class="i">I</span>
        <span class="n">N</span>
        <span class="v">V</span>
        <span class="i">I</span>
        <span class="t">T</span>
        <span class="a">A</span>
        <span class="c">C</span>
        <span class="i">I</span>
        <span class="o">Ó</span>
        <span class="n">N</span>

    </div>


    <!-- BURBUJA -->

    <div class="subtitle">
        ✨ ¡Una aventura te espera! ✨
    </div>


</div>


<!-- =========================================
     SEGUNDA PÁGINA
========================================= -->

<div class="toy-screen" id="toyScreen">

    <img
        src="pagina 2.png"
        class="invitation-image"
        alt="Invitación de cumpleaños"
    >

</div>


<!-- =========================================
     MÚSICA
========================================= -->

<audio id="music" loop>

    <source
        src="Toys Story.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- BOTÓN DE MÚSICA -->

<button
    class="music-btn"
    id="musicBtn">
    🔊
</button>


<script>


const startScreen =
    document.getElementById("startScreen");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");


let opened = false;


/* =========================================
   ABRIR INVITACIÓN
========================================= */

startScreen.addEventListener("click",function(){

    if(opened) return;

    opened = true;


    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65"

    ];


    /* =====================================
       CONFETI
    ===================================== */

    for(let i=0;i<70;i++){

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random()*100+"vw";

        confetti.style.top =
            (-Math.random()*20)+"vh";

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        confetti.style.setProperty(
            "--x",
            (Math.random()*300-150)+"px"
        );

        confetti.style.animationDuration =
            (2+Math.random()*1.5)+"s";


        document.body.appendChild(confetti);


        setTimeout(()=>{

            confetti.remove();

        },4000);

    }


    /* =====================================
       SERPENTINAS
    ===================================== */

    for(let i=0;i<25;i++){

        const streamer =
            document.createElement("div");

        streamer.className =
            "streamer";

        streamer.style.left =
            Math.random()*100+"vw";

        streamer.style.top =
            (-Math.random()*20)+"vh";

        streamer.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        streamer.style.setProperty(
            "--x",
            (Math.random()*250-125)+"px"
        );

        streamer.style.animationDuration =
            (2.5+Math.random()*1.5)+"s";


        document.body.appendChild(streamer);


        setTimeout(()=>{

            streamer.remove();

        },4500);

    }


    /* =====================================
       MÚSICA
    ===================================== */

    music.volume=.7;

    music.play().catch(()=>{});


    /* =====================================
       CAMBIO A LA SEGUNDA PÁGINA
    ===================================== */

    setTimeout(()=>{

        startScreen.style.opacity="0";


        setTimeout(()=>{

            startScreen.style.display="none";

        },500);

    },500);

});


/* =========================================
   BOTÓN DE MÚSICA
========================================= */

musicBtn.addEventListener("click",function(e){

    e.stopPropagation();


    if(music.paused){

        music.play();

        musicBtn.textContent="🔊";

    }else{

        music.pause();

        musicBtn.textContent="🔇";

    }

});

</script>

</body>
</html>
