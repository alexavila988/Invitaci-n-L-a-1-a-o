<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Invitación de cumpleaños</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* =========================================================
   PRIMERA PANTALLA
   ========================================================= */

.start-screen{
    position:fixed;
    inset:0;
    z-index:10;

    background-image:url("fondo toys story.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    overflow:hidden;
    cursor:pointer;

    transition:opacity .5s ease;
}


/* =========================================================
   ESTRELLAS
   ========================================================= */

.star{
    position:absolute;
    z-index:2;

    color:white;
    font-size:22px;

    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        transform:scale(.7) rotate(0deg);
        opacity:.4;
    }

    50%{
        transform:scale(1.25) rotate(20deg);
        opacity:1;
    }
}


/* POSICIONES DE LAS 30 ESTRELLAS */

.star:nth-child(1){top:6%;left:8%;font-size:18px;animation-delay:.2s;}
.star:nth-child(2){top:11%;left:24%;font-size:13px;animation-delay:1.1s;}
.star:nth-child(3){top:5%;left:43%;font-size:24px;animation-delay:.5s;}
.star:nth-child(4){top:14%;left:68%;font-size:15px;animation-delay:1.7s;}
.star:nth-child(5){top:8%;left:91%;font-size:20px;animation-delay:.8s;}

.star:nth-child(6){top:22%;left:5%;font-size:14px;animation-delay:1.4s;}
.star:nth-child(7){top:25%;left:18%;font-size:22px;animation-delay:.3s;}
.star:nth-child(8){top:20%;left:82%;font-size:16px;animation-delay:1.8s;}
.star:nth-child(9){top:29%;left:95%;font-size:22px;animation-delay:.6s;}

.star:nth-child(10){top:37%;left:7%;font-size:17px;animation-delay:1.3s;}
.star:nth-child(11){top:34%;left:27%;font-size:12px;animation-delay:.9s;}
.star:nth-child(12){top:39%;left:73%;font-size:20px;animation-delay:1.6s;}
.star:nth-child(13){top:42%;left:90%;font-size:14px;animation-delay:.4s;}

.star:nth-child(14){top:52%;left:4%;font-size:22px;animation-delay:1.2s;}
.star:nth-child(15){top:49%;left:19%;font-size:15px;animation-delay:.7s;}
.star:nth-child(16){top:55%;left:82%;font-size:20px;animation-delay:1.9s;}
.star:nth-child(17){top:51%;left:94%;font-size:13px;animation-delay:.1s;}

.star:nth-child(18){top:64%;left:8%;font-size:16px;animation-delay:1.5s;}
.star:nth-child(19){top:61%;left:25%;font-size:21px;animation-delay:.6s;}
.star:nth-child(20){top:66%;left:76%;font-size:14px;animation-delay:1.1s;}
.star:nth-child(21){top:70%;left:92%;font-size:22px;animation-delay:.3s;}

.star:nth-child(22){top:77%;left:5%;font-size:14px;animation-delay:1.8s;}
.star:nth-child(23){top:73%;left:20%;font-size:19px;animation-delay:.5s;}
.star:nth-child(24){top:78%;left:81%;font-size:15px;animation-delay:1.4s;}
.star:nth-child(25){top:82%;left:95%;font-size:20px;animation-delay:.8s;}

.star:nth-child(26){top:89%;left:10%;font-size:17px;animation-delay:1.6s;}
.star:nth-child(27){top:85%;left:30%;font-size:13px;animation-delay:.4s;}
.star:nth-child(28){top:91%;left:70%;font-size:21px;animation-delay:1.2s;}
.star:nth-child(29){top:87%;left:85%;font-size:15px;animation-delay:.7s;}
.star:nth-child(30){top:94%;left:48%;font-size:18px;animation-delay:1.9s;}


/* =========================================================
   DESTELLOS
   ========================================================= */

.sparkle{
    position:absolute;
    z-index:4;

    color:white;
    font-size:14px;

    text-shadow:
        0 0 5px white,
        0 0 10px #ffd83d;

    opacity:0;

    animation:sparkleAppear 2.8s ease-in-out infinite;
}

.sparkle1{
    top:18%;
    left:35%;
    animation-delay:.5s;
}

.sparkle2{
    top:30%;
    left:65%;
    animation-delay:1.2s;
}

.sparkle3{
    top:45%;
    left:12%;
    animation-delay:2s;
}

.sparkle4{
    top:57%;
    left:88%;
    animation-delay:.8s;
}

.sparkle5{
    top:75%;
    left:35%;
    animation-delay:1.6s;
}

.sparkle6{
    top:84%;
    left:65%;
    animation-delay:2.3s;
}

@keyframes sparkleAppear{

    0%,100%{
        opacity:0;
        transform:scale(.3) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.2) rotate(45deg);
    }
}


/* =========================================================
   ESTRELLAS FUGACES
   ========================================================= */

.shooting-star{
    position:absolute;
    z-index:3;

    width:5px;
    height:5px;

    border-radius:50%;
    background:white;

    box-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 20px #ffd83d;

    opacity:0;

    transform:rotate(-35deg);
}

.shooting-star::after{
    content:"";

    position:absolute;
    top:50%;
    right:3px;

    width:90px;
    height:2px;

    transform:translateY(-50%);

    background:linear-gradient(
        to left,
        rgba(255,255,255,.9),
        rgba(255,255,255,0)
    );
}

.shooting1{
    top:18%;
    left:-100px;

    animation:shooting 8s linear infinite;
    animation-delay:3s;
}

.shooting2{
    top:32%;
    left:-100px;

    animation:shooting 9s linear infinite;
    animation-delay:7s;
}

@keyframes shooting{

    0%{
        left:-100px;
        opacity:0;
    }

    5%{
        opacity:1;
    }

    20%{
        left:110%;
        opacity:0;
    }

    100%{
        left:110%;
        opacity:0;
    }
}


/* =========================================================
   TÍTULO
   ========================================================= */

.title{
    position:relative;
    z-index:5;

    font-family:Impact,"Arial Black",sans-serif;
    font-weight:900;

    text-transform:uppercase;

    line-height:.9;
    letter-spacing:1px;

    text-shadow:
        4px 4px 0 #173b70,
        -2px -2px 0 #173b70,
        2px -2px 0 #173b70,
        -2px 2px 0 #173b70;

    display:flex;
    justify-content:center;
}

.title span{
    display:inline-block;
    transform-origin:top center;
}


/* =========================================================
   ANIMACIÓN INDIVIDUAL DE LAS LETRAS
   ========================================================= */

.abrir span:nth-child(1){
    animation:letter1 2.5s ease-in-out infinite;
}

.abrir span:nth-child(2){
    animation:letter2 2.8s ease-in-out infinite;
}

.abrir span:nth-child(3){
    animation:letter3 2.3s ease-in-out infinite;
}

.abrir span:nth-child(4){
    animation:letter4 2.7s ease-in-out infinite;
}

.abrir span:nth-child(5){
    animation:letter5 2.4s ease-in-out infinite;
}

.invitacion span:nth-child(1){
    animation:letter6 2.7s ease-in-out infinite;
}

.invitacion span:nth-child(2){
    animation:letter7 2.4s ease-in-out infinite;
}

.invitacion span:nth-child(3){
    animation:letter8 2.8s ease-in-out infinite;
}

.invitacion span:nth-child(4){
    animation:letter9 2.5s ease-in-out infinite;
}

.invitacion span:nth-child(5){
    animation:letter10 2.9s ease-in-out infinite;
}

.invitacion span:nth-child(6){
    animation:letter11 2.3s ease-in-out infinite;
}

.invitacion span:nth-child(7){
    animation:letter12 2.6s ease-in-out infinite;
}

.invitacion span:nth-child(8){
    animation:letter13 2.4s ease-in-out infinite;
}

.invitacion span:nth-child(9){
    animation:letter14 2.8s ease-in-out infinite;
}

.invitacion span:nth-child(10){
    animation:letter6 2.6s ease-in-out infinite;
}

@keyframes letter1{
    0%,100%{transform:rotate(-3deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-8px);}
}

@keyframes letter2{
    0%,100%{transform:rotate(3deg) translateY(0);}
    50%{transform:rotate(-5deg) translateY(7px);}
}

@keyframes letter3{
    0%,100%{transform:rotate(-2deg) translateY(0);}
    50%{transform:rotate(5deg) translateY(-6px);}
}

@keyframes letter4{
    0%,100%{transform:rotate(4deg) translateY(0);}
    50%{transform:rotate(-4deg) translateY(8px);}
}

@keyframes letter5{
    0%,100%{transform:rotate(-4deg) translateY(0);}
    50%{transform:rotate(3deg) translateY(-7px);}
}

@keyframes letter6{
    0%,100%{transform:rotate(-3deg) translateY(0);}
    50%{transform:rotate(3deg) translateY(-6px);}
}

@keyframes letter7{
    0%,100%{transform:rotate(3deg) translateY(0);}
    50%{transform:rotate(-4deg) translateY(6px);}
}

@keyframes letter8{
    0%,100%{transform:rotate(-2deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-7px);}
}

@keyframes letter9{
    0%,100%{transform:rotate(4deg) translateY(0);}
    50%{transform:rotate(-3deg) translateY(7px);}
}

@keyframes letter10{
    0%,100%{transform:rotate(-3deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-6px);}
}

@keyframes letter11{
    0%,100%{transform:rotate(3deg) translateY(0);}
    50%{transform:rotate(-4deg) translateY(7px);}
}

@keyframes letter12{
    0%,100%{transform:rotate(-4deg) translateY(0);}
    50%{transform:rotate(3deg) translateY(-6px);}
}

@keyframes letter13{
    0%,100%{transform:rotate(2deg) translateY(0);}
    50%{transform:rotate(-4deg) translateY(7px);}
}

@keyframes letter14{
    0%,100%{transform:rotate(-3deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-6px);}
}


/* =========================================================
   TAMAÑOS
   ========================================================= */

.abrir{
    position:relative;
    font-size:clamp(55px,15vw,105px);
}

.invitacion{
    font-size:clamp(38px,10vw,72px);
    margin-top:10px;
}


/* =========================================================
   COLORES
   ========================================================= */

.title .a{color:#ef5350;}
.title .b{color:#ffd83d;}
.title .r{color:#42a5f5;}
.title .i{color:#66bb6a;}
.title .n{color:#ff8a65;}
.title .v{color:#ab47bc;}
.title .t{color:#42a5f5;}
.title .c{color:#ffd83d;}
.title .o{color:#ef5350;}


/* =========================================================
   BRILLO
   ========================================================= */

.abrir::after{
    content:"";

    position:absolute;
    top:0;
    bottom:0;
    left:-25%;

    width:18%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.95),
        transparent
    );

    transform:skewX(-20deg);

    opacity:0;
    pointer-events:none;

    animation:shineTitle 6s ease-in-out infinite;
}

@keyframes shineTitle{

    0%,65%{
        left:-25%;
        opacity:0;
    }

    70%{
        opacity:1;
    }

    85%{
        left:110%;
        opacity:1;
    }

    90%,100%{
        left:110%;
        opacity:0;
    }
}


/* =========================================================
   BURBUJA
   ========================================================= */

.subtitle{
    position:relative;
    z-index:5;

    margin-top:30px;

    background:white;
    color:#173b70;

    padding:12px 22px;

    border:4px solid #173b70;
    border-radius:22px;

    font-size:clamp(15px,4vw,23px);
    font-weight:bold;

    box-shadow:
        4px 5px 0 rgba(23,59,112,.25);

    animation:bubbleFloat 3s ease-in-out infinite;
}

.subtitle::after{
    content:"";

    position:absolute;

    bottom:-15px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:16px solid #173b70;
}

.subtitle::before{
    content:"";

    position:absolute;

    bottom:-9px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    z-index:2;

    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:12px solid white;
}

@keyframes bubbleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* =========================================================
   SEGUNDA PÁGINA
   ========================================================= */

.toy-screen{
    position:fixed;
    inset:0;
    z-index:5;

    background:#f48fb1;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    opacity:1;

    transition:opacity .5s ease;
}

.invitation-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:0;
    box-shadow:none;
}


/* =========================================================
   ZONA TÁCTIL DE LILYPAD
   ========================================================= */

.lilypad-link{
    position:absolute;

    /*
       ZONA INVISIBLE SOBRE LILYPAD

       Parte inferior central de la invitación.
       Se puede ajustar fácilmente si es necesario.
    */

    left:35%;
    top:70%;
    width:30%;
    height:17%;

    z-index:20;

    background:transparent;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
    tap-highlight-color:transparent;
}


/* =========================================================
   CONFETI
   ========================================================= */

.confetti{
    position:fixed;

    z-index:30;

    width:9px;
    height:14px;

    pointer-events:none;

    animation:confettiFall 2.5s linear forwards;
}

@keyframes confettiFall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(720deg);

        opacity:0;
    }
}


/* =========================================================
   SERPENTINAS
   ========================================================= */

.streamer{
    position:fixed;

    z-index:29;

    width:7px;
    height:90px;

    border-radius:50%;

    pointer-events:none;

    animation:streamerFall 3s ease-in forwards;
}

@keyframes streamerFall{

    0%{
        transform:
            translateY(-100px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(540deg);

        opacity:0;
    }
}


/* =========================================================
   BOTÓN DE MÚSICA
   ========================================================= */

.music-btn{
    position:fixed;

    z-index:50;

    right:15px;
    bottom:15px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:3px solid #173b70;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.25);
}


/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:600px){

    .star{
        font-size:18px;
    }

    .sparkle{
        font-size:12px;
    }

    .subtitle{
        margin-top:25px;
        padding:10px 17px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     PRIMERA PANTALLA
     ===================================================== -->

<div class="start-screen" id="startScreen">


    <!-- 30 ESTRELLAS -->

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>


    <!-- DESTELLOS -->

    <span class="sparkle sparkle1">✦</span>
    <span class="sparkle sparkle2">✦</span>
    <span class="sparkle sparkle3">✦</span>
    <span class="sparkle sparkle4">✦</span>
    <span class="sparkle sparkle5">✦</span>
    <span class="sparkle sparkle6">✦</span>


    <!-- ESTRELLAS FUGACES -->

    <div class="shooting-star shooting1"></div>
    <div class="shooting-star shooting2"></div>


    <!-- ABRIR -->

    <div class="title abrir">

        <span class="a">A</span>
        <span class="b">B</span>
        <span class="r">R</span>
        <span class="i">I</span>
        <span class="r">R</span>

    </div>


    <!-- INVITACIÓN -->

    <div class="title invitacion">

        <span class="i">I</span>
        <span class="n">N</span>
        <span class="v">V</span>
        <span class="i">I</span>
        <span class="t">T</span>
        <span class="a">A</span>
        <span class="c">C</span>
        <span class="i">I</span>
        <span class="o">Ó</span>
        <span class="n">N</span>

    </div>


    <!-- BURBUJA -->

    <div class="subtitle">
        ✨ ¡Una aventura te espera! ✨
    </div>

</div>



<!-- =====================================================
     SEGUNDA PÁGINA
     ===================================================== -->

<div class="toy-screen" id="toyScreen">

    <img
        src="pagina 2.png"
        class="invitation-image"
        alt="Invitación de cumpleaños"
    >

    <!--
        ZONA INVISIBLE DE LILYPAD
        Al tocar esta zona se abre Google Maps.
    -->

    <a
        class="lilypad-link"
        href="https://maps.app.goo.gl/ErKKQbnFPtNkmCkM7"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir ubicación en Google Maps"
    ></a>

</div>



<!-- =====================================================
     MÚSICA
     ===================================================== -->

<audio id="music" loop>

    <source
        src="Toys Story.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- BOTÓN DE MÚSICA -->

<button
    class="music-btn"
    id="musicBtn"
>
    🔊
</button>



<script>

/* =====================================================
   ELEMENTOS
   ===================================================== */

const startScreen =
    document.getElementById("startScreen");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

let opened = false;


/* =====================================================
   ABRIR INVITACIÓN
   ===================================================== */

startScreen.addEventListener("click",function(){

    if(opened) return;

    opened = true;


    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65"

    ];


    /* =================================================
       CONFETI
       ================================================= */

    for(let i=0;i<70;i++){

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random()*100+"vw";

        confetti.style.top =
            (-Math.random()*20)+"vh";

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        confetti.style.setProperty(
            "--x",
            (Math.random()*300-150)+"px"
        );

        confetti.style.animationDuration =
            (2+Math.random()*1.5)+"s";

        document.body.appendChild(confetti);


        setTimeout(()=>{

            confetti.remove();

        },4000);

    }


    /* =================================================
       SERPENTINAS
       ================================================= */

    for(let i=0;i<25;i++){

        const streamer =
            document.createElement("div");

        streamer.className =
            "streamer";

        streamer.style.left =
            Math.random()*100+"vw";

        streamer.style.top =
            (-Math.random()*20)+"vh";

        streamer.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        streamer.style.setProperty(
            "--x",
            (Math.random()*250-125)+"px"
        );

        streamer.style.animationDuration =
            (2.5+Math.random()*1.5)+"s";

        document.body.appendChild(streamer);


        setTimeout(()=>{

            streamer.remove();

        },4500);

    }


    /* =================================================
       MÚSICA
       ================================================= */

    music.volume = .7;

    music.play().catch(()=>{});


    /* =================================================
       CAMBIO DE PANTALLA
       ================================================= */

    setTimeout(()=>{

        startScreen.style.opacity = "0";


        setTimeout(()=>{

            startScreen.style.display = "none";

        },500);

    },500);

});


/* =====================================================
   BOTÓN DE MÚSICA
   ===================================================== */

musicBtn.addEventListener("click",function(e){

    e.stopPropagation();


    if(music.paused){

        music.play();

        musicBtn.textContent = "🔊";

    }else{

        music.pause();

        musicBtn.textContent = "🔇";

    }

});

</script>

</body>
</html>
