<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Invitación</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* =========================
   PRIMERA PANTALLA
========================= */

.start-screen{
    position:fixed;
    inset:0;
    z-index:10;

    background-image:url("fondo toys story.png");
    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    opacity:1;
    transition:opacity .5s ease;

    overflow:hidden;
}


/* =========================
   ESTRELLAS
========================= */

.star{
    position:absolute;
    z-index:2;

    color:white;
    font-size:22px;

    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:twinkle 2s infinite ease-in-out;
}

.star:nth-child(1){left:5%;top:8%;animation-delay:.2s;}
.star:nth-child(2){left:15%;top:18%;animation-delay:1s;}
.star:nth-child(3){left:25%;top:7%;animation-delay:.5s;}
.star:nth-child(4){left:35%;top:25%;animation-delay:1.4s;}
.star:nth-child(5){left:45%;top:10%;animation-delay:.8s;}
.star:nth-child(6){left:55%;top:20%;animation-delay:1.7s;}
.star:nth-child(7){left:65%;top:6%;animation-delay:.4s;}
.star:nth-child(8){left:75%;top:17%;animation-delay:1.2s;}
.star:nth-child(9){left:85%;top:8%;animation-delay:.7s;}
.star:nth-child(10){left:94%;top:25%;animation-delay:1.6s;}

.star:nth-child(11){left:8%;top:38%;animation-delay:.3s;}
.star:nth-child(12){left:18%;top:48%;animation-delay:1.3s;}
.star:nth-child(13){left:30%;top:40%;animation-delay:.9s;}
.star:nth-child(14){left:42%;top:50%;animation-delay:1.8s;}
.star:nth-child(15){left:55%;top:42%;animation-delay:.6s;}
.star:nth-child(16){left:68%;top:50%;animation-delay:1.1s;}
.star:nth-child(17){left:80%;top:40%;animation-delay:.1s;}
.star:nth-child(18){left:92%;top:48%;animation-delay:1.5s;}

.star:nth-child(19){left:4%;top:68%;animation-delay:.9s;}
.star:nth-child(20){left:15%;top:78%;animation-delay:1.6s;}
.star:nth-child(21){left:28%;top:70%;animation-delay:.4s;}
.star:nth-child(22){left:40%;top:82%;animation-delay:1.3s;}
.star:nth-child(23){left:53%;top:72%;animation-delay:.7s;}
.star:nth-child(24){left:66%;top:80%;animation-delay:1.8s;}
.star:nth-child(25){left:78%;top:68%;animation-delay:.5s;}
.star:nth-child(26){left:89%;top:78%;animation-delay:1.1s;}
.star:nth-child(27){left:12%;top:92%;animation-delay:.2s;}
.star:nth-child(28){left:35%;top:94%;animation-delay:1.4s;}
.star:nth-child(29){left:65%;top:93%;animation-delay:.8s;}
.star:nth-child(30){left:88%;top:91%;animation-delay:1.7s;}

@keyframes twinkle{

    0%,100%{
        transform:scale(.7) rotate(0deg);
        opacity:.4;
    }

    50%{
        transform:scale(1.25) rotate(20deg);
        opacity:1;
    }
}


/* =========================
   DESTELLOS PRIMERA PÁGINA
========================= */

.sparkle{
    position:absolute;
    z-index:3;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 20px #ffd83d;

    animation:sparkleAppear 2.5s ease-in-out infinite;
}

.sparkle1{
    left:20%;
    top:30%;
    font-size:18px;
    animation-delay:.3s;
}

.sparkle2{
    left:78%;
    top:32%;
    font-size:20px;
    animation-delay:1s;
}

.sparkle3{
    left:10%;
    top:55%;
    font-size:16px;
    animation-delay:1.6s;
}

.sparkle4{
    left:88%;
    top:58%;
    font-size:18px;
    animation-delay:.7s;
}

.sparkle5{
    left:25%;
    top:88%;
    font-size:15px;
    animation-delay:1.3s;
}

.sparkle6{
    left:73%;
    top:85%;
    font-size:18px;
    animation-delay:2s;
}

@keyframes sparkleAppear{

    0%,100%{
        opacity:0;
        transform:scale(.3) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.2) rotate(45deg);
    }
}


/* =========================
   ESTRELLAS FUGACES
========================= */

.shooting-star{
    position:absolute;
    z-index:4;

    width:3px;
    height:3px;

    background:white;
    border-radius:50%;

    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 20px #ffd83d;

    opacity:0;
}

.shooting-star::after{
    content:"";

    position:absolute;

    width:80px;
    height:2px;

    right:0;
    top:0;

    background:linear-gradient(
        to left,
        white,
        transparent
    );

    transform-origin:right center;
}

.shooting1{
    top:18%;
    left:-10%;

    animation:shooting 6s linear infinite;
}

.shooting2{
    top:38%;
    left:-20%;

    animation:shooting 8s linear infinite;
    animation-delay:3s;
}

@keyframes shooting{

    0%{
        transform:translate(0,0) rotate(-25deg);
        opacity:0;
    }

    5%{
        opacity:1;
    }

    25%{
        transform:translate(120vw,50vh) rotate(-25deg);
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================
   TITULO
========================= */

.title{
    position:relative;
    z-index:5;

    font-weight:900;
    text-align:center;

    letter-spacing:2px;

    text-shadow:
        3px 3px 0 rgba(0,0,0,.15),
        0 0 8px rgba(255,255,255,.5);
}

.abrir{
    position:relative;

    font-size:clamp(55px,15vw,105px);
}

.invitacion{
    font-size:clamp(38px,10vw,72px);
    margin-top:10px;
}


/* =========================
   COLORES DE LETRAS
========================= */

.title .a{color:#ef5350;}
.title .b{color:#ffd83d;}
.title .r{color:#42a5f5;}
.title .i{color:#66bb6a;}
.title .n{color:#ff8a65;}
.title .v{color:#ab47bc;}
.title .t{color:#42a5f5;}
.title .c{color:#ffd83d;}
.title .o{color:#ef5350;}


/* =========================
   ANIMACIONES LETRAS
========================= */

.abrir span{
    display:inline-block;
    animation:letter1 2s ease-in-out infinite;
}

.invitacion span{
    display:inline-block;
    animation:letter2 2s ease-in-out infinite;
}

.abrir .a{animation-delay:.0s;}
.abrir .b{animation-delay:.1s;}
.abrir .r{animation-delay:.2s;}
.abrir .i{animation-delay:.3s;}
.abrir .r:nth-child(5){animation-delay:.4s;}

.invitacion .i:nth-child(1){animation-delay:.0s;}
.invitacion .n:nth-child(2){animation-delay:.1s;}
.invitacion .v{animation-delay:.2s;}
.invitacion .i:nth-child(4){animation-delay:.3s;}
.invitacion .t{animation-delay:.4s;}
.invitacion .a{animation-delay:.5s;}
.invitacion .c{animation-delay:.6s;}
.invitacion .i:nth-child(8){animation-delay:.7s;}
.invitacion .o{animation-delay:.8s;}
.invitacion .n:nth-child(10){animation-delay:.9s;}

@keyframes letter1{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-10px) rotate(3deg);
    }
}

@keyframes letter2{

    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-6px) scale(1.05);
    }
}


/* =========================
   BRILLO TITULO
========================= */

.abrir::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-10px;

    height:4px;

    background:white;

    border-radius:50%;

    filter:blur(4px);

    opacity:.7;

    animation:titleShine 2s ease-in-out infinite;
}

@keyframes titleShine{

    0%,100%{
        transform:scaleX(.4);
        opacity:.3;
    }

    50%{
        transform:scaleX(1);
        opacity:1;
    }
}


/* =========================
   SUBTITULO
========================= */

.subtitle{
    position:relative;
    z-index:6;

    margin-top:25px;

    background:white;

    color:#17365d;

    padding:12px 20px;

    border-radius:30px;

    border:3px solid #17365d;

    font-size:clamp(15px,4vw,21px);

    font-weight:bold;

    box-shadow:
        0 5px 12px rgba(0,0,0,.2);

    animation:subtitleFloat 2.5s ease-in-out infinite;
}

@keyframes subtitleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}


/* =========================
   SEGUNDA PÁGINA
========================= */

.toy-screen{
    position:fixed;
    inset:0;

    z-index:5;

    background:#f48fb1;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    opacity:1;

    transition:opacity .5s ease;
}

.invitation-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:0;

    box-shadow:none;
}


/* =========================
   UBICACIÓN LILYPAD
========================= */

.lilypad-link{
    position:absolute;

    left:35%;
    top:70%;

    width:30%;
    height:17%;

    z-index:20;

    background:transparent;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
    tap-highlight-color:transparent;
}


/* =========================
   CONTENEDOR DESTELLOS
========================= */

#starContainer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:14;

    pointer-events:none;

    overflow:hidden;
}

.magic-star{
    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    opacity:0;

    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:magicStar 2.8s ease-in-out forwards;
}

.magic-star::before,
.magic-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    background:white;

    transform:translate(-50%,-50%);
}

.magic-star::before{
    width:22px;
    height:2px;
}

.magic-star::after{
    width:2px;
    height:22px;
}

@keyframes magicStar{

    0%{
        opacity:0;
        transform:scale(.2) rotate(0deg);
    }

    25%{
        opacity:.5;
        transform:scale(.7) rotate(30deg);
    }

    50%{
        opacity:1;
        transform:scale(1.4) rotate(45deg);
    }

    70%{
        opacity:.8;
        transform:scale(1) rotate(60deg);
    }

    100%{
        opacity:0;
        transform:scale(.2) rotate(90deg);
    }
}


/* =========================
   GLOBOS
========================= */

.balloon{
    position:absolute;

    z-index:16;

    bottom:-100px;

    width:38px;
    height:48px;

    border-radius:50% 50% 45% 45%;

    pointer-events:auto;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    opacity:0;

    animation:balloonUp 7s linear forwards;
}

.balloon::before{
    content:"";

    position:absolute;

    top:7px;
    left:9px;

    width:10px;
    height:15px;

    border-radius:50%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);
}

.balloon::after{
    content:"";

    position:absolute;

    left:50%;

    bottom:-55px;

    width:1px;
    height:55px;

    background:rgba(80,80,80,.7);

    transform:translateX(-50%);
}

@keyframes balloonUp{

    0%{
        bottom:-100px;
        opacity:0;
    }

    8%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        bottom:110vh;
        opacity:0;
    }
}


/* =========================
   EXPLOSIÓN DEL GLOBO
========================= */

.pop-particle{
    position:fixed;

    z-index:40;

    width:7px;
    height:10px;

    border-radius:2px;

    pointer-events:none;

    animation:popParticle .65s ease-out forwards;
}

@keyframes popParticle{

    0%{
        transform:
            translate(0,0)
            scale(1)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translate(var(--dx),var(--dy))
            scale(.3)
            rotate(360deg);

        opacity:0;
    }
}

.pop-burst{
    position:fixed;

    z-index:39;

    width:20px;
    height:20px;

    border:3px solid white;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    animation:popBurst .45s ease-out forwards;

    box-shadow:
        0 0 10px white,
        0 0 20px #ffd83d;
}

@keyframes popBurst{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(3);
    }
}


/* =========================
   CONFETI
========================= */

.confetti{
    position:fixed;

    z-index:30;

    width:9px;
    height:14px;

    pointer-events:none;

    animation:confettiFall 2.5s linear forwards;
}

@keyframes confettiFall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(720deg);

        opacity:0;
    }
}


/* =========================
   SERPENTINAS
========================= */

.streamer{
    position:fixed;

    z-index:29;

    width:7px;
    height:90px;

    border-radius:50%;

    pointer-events:none;

    animation:streamerFall 3s ease-in forwards;
}

@keyframes streamerFall{

    0%{
        transform:
            translateY(-100px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(540deg);

        opacity:0;
    }
}


/* =========================
   BOTÓN MÚSICA
========================= */

.music-btn{
    position:fixed;

    z-index:50;

    right:15px;
    bottom:15px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:3px solid #17365d;

    background:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,.25);

    -webkit-tap-highlight-color:transparent;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .star{
        font-size:18px;
    }

    .sparkle{
        font-size:15px;
    }

    .subtitle{
        padding:10px 15px;
    }

    .balloon{
        width:34px;
        height:43px;
    }
}

</style>
</head>


<body>

     PRIMERA PANTALLA
========================= -->

<div class="start-screen" id="startScreen">

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>

    <span class="star">★</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>
    <span class="star">✦</span>

    <span class="star">★</span>
    <span class="star">✦</span>
    <span class="star">★</span>

    <span class="star">★</span>

    <span class="star">★</span>

    <div class="title invitacion">

        <span class="i">I</span>

<script>

/* =========================
   ELEMENTOS
========================= */

const startScreen =
    document.getElementById("startScreen");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

const toyScreen =
    document.getElementById("toyScreen");

const balloonContainer =
    document.getElementById("balloonContainer");

const starContainer =
    document.getElementById("starContainer");

let opened = false;


/* =========================
   ABRIR INVITACIÓN
========================= */

startScreen.addEventListener("click",function(){

    if(opened) return;

    opened = true;


    /* COLORES */

    const colors = [
        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"
    ];


    /* =========================
       CONFETI
    ========================= */

    for(let i=0;i<70;i++){

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";

        piece.style.left =
            Math.random()*100+"%";

        piece.style.top =
            (-10-Math.random()*20)+"%";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        piece.style.setProperty(
            "--x",
            (Math.random()*200-100)+"px"
        );

        piece.style.animationDuration =
            (2+Math.random()*1.5)+"s";

        document.body.appendChild(piece);

        setTimeout(
            ()=>piece.remove(),
            4000
        );
    }


    /* =========================
       SERPENTINAS
    ========================= */

    for(let i=0;i<25;i++){

        const streamer =
            document.createElement("div");

        streamer.className =
            "streamer";

        streamer.style.left =
            Math.random()*100+"%";

        streamer.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        streamer.style.setProperty(
            "--x",
            (Math.random()*180-90)+"px"
        );

        streamer.style.animationDuration =
            (2.5+Math.random()*1)+"s";

        document.body.appendChild(streamer);

        setTimeout(
            ()=>streamer.remove(),
            4500
        );
    }


    /* =========================
       MÚSICA
    ========================= */

    music.volume=.7;

    music.play().catch(()=>{});


    /* =========================
       CERRAR PRIMERA PANTALLA
    ========================= */

    setTimeout(()=>{

        startScreen.style.opacity="0";

        setTimeout(()=>{

            startScreen.style.display="none";

        },500);

    },500);

});


/* =========================
   EXPLOSIÓN DEL GLOBO
========================= */

function popBalloon(balloon){

    if(
        !balloon ||
        balloon.dataset.popped==="1"
    ){
        return;
    }


    balloon.dataset.popped="1";


    const rect =
        balloon.getBoundingClientRect();


    const x =
        rect.left + rect.width/2;

    const y =
        rect.top + rect.height/2;


    /* DETENER GLOBO */

    balloon.style.animation="none";

    balloon.style.transition=
        "transform .12s ease, opacity .12s ease";

    balloon.style.transform=
        "scale(1.35)";

    balloon.style.opacity="0";


    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    /* =========================
       PARTÍCULAS
    ========================= */

    for(let i=0;i<14;i++){

        const piece =
            document.createElement("div");

        piece.className =
            "pop-particle";


        piece.style.left =
            x+"px";

        piece.style.top =
            y+"px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];


        piece.style.setProperty(
            "--dx",
            (Math.random()*120-60)+"px"
        );

        piece.style.setProperty(
            "--dy",
            (Math.random()*120-60)+"px"
        );


        piece.style.transform =
            "rotate("+
            Math.random()*360+
            "deg)";


        document.body.appendChild(piece);


        setTimeout(
            ()=>piece.remove(),
            700
        );

    }


    /* =========================
       DESTELLO DE EXPLOSIÓN
    ========================= */

    const burst =
        document.createElement("div");

    burst.className="pop-burst";

    burst.style.left=x+"px";
    burst.style.top=y+"px";

    document.body.appendChild(burst);


    setTimeout(
        ()=>burst.remove(),
        500
    );


    /* ELIMINAR GLOBO */

    setTimeout(
        ()=>balloon.remove(),
        150
    );
}


/* =========================
   CREAR GLOBOS
========================= */

function createBalloons(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    /* =========================
       CANTIDAD 1-3
    ========================= */

    const amount =
        Math.floor(Math.random()*3)+1;


    /*
       COPIA DE COLORES DISPONIBLES

       Esto garantiza que dentro
       del mismo grupo NO se repita
       ningún color.
    */

    const availableColors =
        [...colors];


    for(let i=0;i<amount;i++){

        const balloon =
            document.createElement("div");


        balloon.className =
            "balloon";


        /* =========================
           POSICIÓN HORIZONTAL
        ========================= */

        balloon.style.left =
            (10+Math.random()*80)+"%";


        /* =========================
           COLOR SIN REPETIR
        ========================= */

        const colorIndex =
            Math.floor(
                Math.random()*
                availableColors.length
            );


        const selectedColor =
            availableColors.splice(
                colorIndex,
                1
            )[0];


        balloon.style.background =
            selectedColor;


        /* =========================
           TAMAÑO
        ========================= */

        const size =
            30+Math.random()*15;


        balloon.style.width =
            size+"px";


        balloon.style.height =
            (size*1.25)+"px";


        /* =========================
           VELOCIDAD
        ========================= */

        balloon.style.animationDuration =
            (6.5+Math.random()*2)+"s";


        /* =========================
           EXPLOTAR AL TOCAR
        ========================= */

        balloon.addEventListener(
            "pointerdown",
            function(e){

                e.preventDefault();
                e.stopPropagation();

                popBalloon(balloon);

            }
        );


        balloonContainer.appendChild(
            balloon
        );


        setTimeout(
            ()=>{

                if(
                    balloon.dataset.popped!=="1"
                ){
                    balloon.remove();
                }

            },
            9500
        );

    }


    /* =========================
       SIGUIENTE GRUPO
       ENTRE 4 Y 6 SEGUNDOS
    ========================= */

    const nextTime =
        4000+Math.random()*2000;


    setTimeout(
        createBalloons,
        nextTime
    );

}


/* =========================
   DESTELLOS PÁGINA 2
========================= */

function createMagicStar(){

    const star =
        document.createElement("div");


    star.className =
        "magic-star";


    star.style.left =
        (5+Math.random()*90)+"%";


    star.style.top =
        (5+Math.random()*88)+"%";


    const size =
        4+Math.random()*6;


    star.style.width =
        size+"px";


    star.style.height =
        size+"px";


    star.style.animationDuration =
        (2+Math.random()*2)+"s";


    star.style.animationDelay =
        (Math.random()*.5)+"s";


    starContainer.appendChild(
        star
    );


    setTimeout(
        ()=>star.remove(),
        4500
    );

}


/* =========================
   CICLO DESTELLOS
========================= */

function starLoop(){

    const amount =
        Math.floor(Math.random()*3)+1;


    for(let i=0;i<amount;i++){

        createMagicStar();

    }


    const nextTime =
        1500+Math.random()*1500;


    setTimeout(
        starLoop,
        nextTime
    );

}


/* =========================
   INICIAR ANIMACIONES
========================= */

setTimeout(()=>{

    createBalloons();

    starLoop();

},3500);
