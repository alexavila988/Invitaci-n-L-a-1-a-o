
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invitación Toy Story</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #4da6e8;
      font-family: Arial, sans-serif;
    }

    /* =========================
       PANTALLA INICIAL
       ========================= */

    .start-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background-image: url("fondo toys story.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;
      cursor: pointer;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       GRUPO DE LETRAS
       ========================= */

    .titulo {
      position: relative;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      gap: clamp(2px, 1vw, 8px);

      transform: translateY(10px);
    }

    /* Cada letra */

    .letra {
      position: relative;

      display: inline-block;

      color: white;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

      font-size: clamp(58px, 17vw, 125px);
      font-weight: 900;

      line-height: 1;

      text-transform: uppercase;

      -webkit-text-stroke: 3px #1f4f91;

      text-shadow:
        5px 5px 0 #e5a900,
        7px 7px 0 #17447f,
        0 0 12px rgba(255,255,255,0.8);

      transform-origin: top center;

      animation: balanceo 3s infinite ease-in-out;
    }

    /* Cuerda de cada letra */

    .letra::before {
      content: "";

      position: absolute;

      width: 3px;
      height: 42px;

      top: -39px;
      left: 50%;

      transform: translateX(-50%);

      background: #d3aa70;

      border-radius: 4px;

      box-shadow:
        1px 1px 2px rgba(0,0,0,0.3);
    }

    /* Nudo */

    .letra::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      top: -4px;
      left: 50%;

      transform: translateX(-50%);

      background: #ae7d45;

      border-radius: 50%;
    }

    /* Movimiento diferente para cada letra */

    .letra:nth-child(1) {
      animation-delay: -0.2s;
      animation-duration: 3.1s;
    }

    .letra:nth-child(2) {
      animation-delay: -1s;
      animation-duration: 2.7s;
    }

    .letra:nth-child(3) {
      animation-delay: -0.4s;
      animation-duration: 3.3s;
    }

    .letra:nth-child(4) {
      animation-delay: -1.4s;
      animation-duration: 2.9s;
    }

    .letra:nth-child(5) {
      animation-delay: -0.8s;
      animation-duration: 3.2s;
    }

    @keyframes balanceo {

      0%, 100% {
        transform: rotate(7deg);
      }

      50% {
        transform: rotate(-7deg);
      }

    }

    /* =========================
       ESTRELLITAS
       ========================= */

    .stars {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    .star {
      position: absolute;

      color: white;

      line-height: 1;

      text-shadow:
        0 0 5px white,
        0 0 10px #ffe875;

      animation: brillo 2.2s infinite ease-in-out;
    }

    /* Diferentes tamaños y posiciones */

    .s1 {
      top: 18%;
      left: 12%;
      font-size: 22px;
      animation-delay: .2s;
    }

    .s2 {
      top: 28%;
      right: 14%;
      font-size: 14px;
      animation-delay: 1s;
    }

    .s3 {
      top: 43%;
      left: 7%;
      font-size: 12px;
      animation-delay: .6s;
    }

    .s4 {
      top: 51%;
      right: 8%;
      font-size: 25px;
      animation-delay: 1.4s;
    }

    .s5 {
      bottom: 21%;
      left: 17%;
      font-size: 15px;
      animation-delay: .9s;
    }

    .s6 {
      bottom: 15%;
      right: 18%;
      font-size: 19px;
      animation-delay: 1.8s;
    }

    .s7 {
      top: 13%;
      right: 34%;
      font-size: 10px;
      animation-delay: .4s;
    }

    .s8 {
      bottom: 31%;
      left: 5%;
      font-size: 9px;
      animation-delay: 1.2s;
    }

    .s9 {
      bottom: 12%;
      right: 6%;
      font-size: 12px;
      animation-delay: .7s;
    }

    .s10 {
      top: 36%;
      left: 24%;
      font-size: 8px;
      animation-delay: 1.6s;
    }

    @keyframes brillo {

      0%, 100% {
        opacity: .3;
        transform: scale(.7) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.25) rotate(15deg);
      }

    }

    /* =========================
       SEGUNDA PANTALLA
       ========================= */

    .toy-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background-image: url("caja juguetes.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 0;

      z-index: 1;

      transition: opacity .8s ease;
    }

    .toy-screen.show {
      opacity: 1;
    }

  </style>
</head>

<body>

  <!-- Segunda pantalla -->
  <div class="toy-screen" id="toyScreen"></div>


  <!-- Pantalla inicial -->
  <div class="start-screen" id="startScreen">

    <!-- Estrellas -->
    <div class="stars">

      <span class="star s1">✦</span>
      <span class="star s2">✦</span>
      <span class="star s3">✦</span>
      <span class="star s4">✦</span>
      <span class="star s5">✦</span>
      <span class="star s6">✦</span>
      <span class="star s7">✦</span>
      <span class="star s8">✦</span>
      <span class="star s9">✦</span>
      <span class="star s10">✦</span>

    </div>


    <!-- PULSA -->
    <div class="titulo">

      <span class="letra">P</span>
      <span class="letra">U</span>
      <span class="letra">L</span>
      <span class="letra">S</span>
      <span class="letra">A</span>

    </div>

  </div>


  <!-- Música -->
  <audio id="music" preload="auto">
    <source src="Toys Story.mp3" type="audio/mpeg">
  </audio>


  <script>

    const startScreen =
      document.getElementById("startScreen");

    const toyScreen =
      document.getElementById("toyScreen");

    const music =
      document.getElementById("music");

    let opened = false;


    startScreen.addEventListener(
      "pointerdown",
      () => {

        if (opened) return;

        opened = true;

        // Música con el mismo toque
        music.play().catch(() => {});

        // Mostrar siguiente pantalla
        toyScreen.classList.add("show");

        // Ocultar pantalla inicial
        setTimeout(() => {

          startScreen.classList.add("hidden");

        }, 250);

      },
      { once: true }
    );

  </script>

</body>
</html>
```
