<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Invitación</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f48fb1;
    font-family:Arial,sans-serif;
}


/* =====================================================
   PANTALLA PRINCIPAL
===================================================== */

.toy-screen{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    z-index:1;
}

.main-background{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;
}


/* =====================================================
   ESTRELLAS DE LA PRIMERA PANTALLA
===================================================== */

.star{
    position:absolute;

    width:5px;
    height:5px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 5px white,
        0 0 12px white;

    z-index:5;

    animation:
        twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.5);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}

.star1{
    left:12%;
    top:18%;
    animation-delay:.2s;
}

.star2{
    left:80%;
    top:16%;
    animation-delay:.7s;
}

.star3{
    left:25%;
    top:30%;
    animation-delay:1.2s;
}

.star4{
    left:88%;
    top:35%;
    animation-delay:.4s;
}

.star5{
    left:70%;
    top:48%;
    animation-delay:1.6s;
}

.star6{
    left:10%;
    top:55%;
    animation-delay:1s;
}

.star7{
    left:48%;
    top:20%;
    animation-delay:.5s;
}

.star8{
    left:60%;
    top:70%;
    animation-delay:1.8s;
}


/* =====================================================
   ESTRELLAS FUGACES
===================================================== */

.shooting-star{
    position:absolute;

    width:70px;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            transparent
        );

    transform:rotate(-35deg);

    opacity:0;

    z-index:5;

    animation:
        shoot 5s linear infinite;
}

@keyframes shoot{

    0%{
        opacity:0;
        transform:
            translate(0,0)
            rotate(-35deg);
    }

    10%{
        opacity:1;
    }

    25%{
        opacity:0;

        transform:
            translate(-150px,150px)
            rotate(-35deg);
    }

    100%{
        opacity:0;
    }
}

.shooting1{
    right:5%;
    top:18%;
    animation-delay:2s;
}

.shooting2{
    right:20%;
    top:35%;
    animation-delay:5s;
}


/* =====================================================
   TEXTO ABRIR INVITACIÓN
===================================================== */

.open-title{
    position:absolute;

    z-index:10;

    top:65%;
    left:50%;

    transform:
        translateX(-50%);

    width:90%;

    text-align:center;

    font-size:
        clamp(
            30px,
            8vw,
            65px
        );

    font-weight:900;

    letter-spacing:2px;

    color:#fff;

    text-shadow:
        3px 3px 0 #2f80ed,
        -2px -2px 0 #2f80ed,
        0 0 8px #fff,
        0 0 18px #ffd83d;

    animation:
        titlePulse 2s infinite ease-in-out;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

@keyframes titlePulse{

    0%,100%{
        transform:
            translateX(-50%)
            scale(1);
    }

    50%{
        transform:
            translateX(-50%)
            scale(1.05);
    }
}


/* =====================================================
   SUBTÍTULO
===================================================== */

.subtitle{
    position:absolute;

    z-index:10;

    top:74%;
    left:50%;

    transform:
        translateX(-50%);

    width:90%;

    text-align:center;

    color:white;

    font-size:
        clamp(
            16px,
            4.5vw,
            26px
        );

    font-weight:bold;

    text-shadow:
        0 0 5px #000,
        0 0 10px #000;
}


/* =====================================================
   PÁGINA 2
===================================================== */

.page2{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#f48fb1;

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    z-index:2;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.page2.show{
    opacity:1;
    visibility:visible;
}


/* =====================================================
   IMAGEN DE LA INVITACIÓN

   IMPORTANTE:
   SE MANTIENE COMO ESTABA ORIGINALMENTE
===================================================== */

.invitation-image{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}


/* =====================================================
   CONTENEDOR DE GLOBOS
===================================================== */

#balloonContainer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:12;

    pointer-events:none;

    overflow:hidden;
}


/* =====================================================
   GLOBOS
===================================================== */

.balloon{
    position:absolute;

    bottom:-100px;

    width:38px;
    height:48px;

    border-radius:
        50% 50% 45% 45%;

    opacity:0;

    pointer-events:none;

    animation:
        balloonUp 7s linear forwards;
}


/* Brillo del globo */

.balloon::before{
    content:"";

    position:absolute;

    top:7px;
    left:9px;

    width:10px;
    height:15px;

    border-radius:50%;

    background:
        rgba(
            255,
            255,
            255,
            .4
        );

    transform:
        rotate(25deg);
}


/* Hilo del globo */

.balloon::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-55px;

    width:1px;
    height:55px;

    background:
        rgba(
            80,
            80,
            80,
            .7
        );

    transform:
        translateX(-50%);
}


/* Movimiento únicamente vertical */

@keyframes balloonUp{

    0%{
        bottom:-100px;
        opacity:0;
    }

    8%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        bottom:110vh;
        opacity:0;
    }
}


/* =====================================================
   CONTENEDOR DE ESTRELLAS DE LA PÁGINA 2
===================================================== */

#starContainer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:14;

    pointer-events:none;

    overflow:hidden;
}


/* =====================================================
   ESTRELLAS MÁGICAS
===================================================== */

.magic-star{
    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    opacity:0;

    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 18px #ffd83d;

    animation:
        magicStar 2.8s
        ease-in-out
        forwards;
}


/* Rayos horizontales y verticales */

.magic-star::before,
.magic-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    background:white;

    transform:
        translate(-50%,-50%);
}

.magic-star::before{
    width:22px;
    height:2px;
}

.magic-star::after{
    width:2px;
    height:22px;
}


/* Animación de las estrellas */

@keyframes magicStar{

    0%{
        opacity:0;

        transform:
            scale(.2)
            rotate(0deg);
    }

    25%{
        opacity:.5;

        transform:
            scale(.7)
            rotate(30deg);
    }

    50%{
        opacity:1;

        transform:
            scale(1.4)
            rotate(45deg);
    }

    70%{
        opacity:.8;

        transform:
            scale(1)
            rotate(60deg);
    }

    100%{
        opacity:0;

        transform:
            scale(.2)
            rotate(90deg);
    }
}


/* =====================================================
   BRILLO DE LILYPAD

   MÁS ABAJO
   FORMA MÁS CUADRADA
===================================================== */

.lilypad-glow{
    position:absolute;

    left:34%;
    top:73%;

    width:32%;
    height:14%;

    z-index:18;

    pointer-events:none;

    border-radius:8px;

    box-shadow:
        0 0 8px
        rgba(
            255,
            255,
            255,
            .15
        ),

        0 0 18px
        rgba(
            255,
            255,
            255,
            .08
        ),

        0 0 30px
        rgba(
            255,
            216,
            61,
            .05
        );

    animation:
        lilypadGlow
        2.5s
        ease-in-out
        infinite;
}


/* Pulsación del brillo */

@keyframes lilypadGlow{

    0%,100%{

        opacity:.2;

        box-shadow:

            0 0 6px
            rgba(
                255,
                255,
                255,
                .15
            ),

            0 0 15px
            rgba(
                255,
                255,
                255,
                .1
            ),

            0 0 25px
            rgba(
                255,
                216,
                61,
                .05
            );
    }

    50%{

        opacity:1;

        box-shadow:

            0 0 8px
            rgba(
                255,
                255,
                255,
                .9
            ),

            0 0 18px
            rgba(
                255,
                255,
                255,
                .75
            ),

            0 0 32px
            rgba(
                255,
                216,
                61,
                .65
            ),

            0 0 48px
            rgba(
                255,
                255,
                255,
                .35
            );
    }
}


/* =====================================================
   ZONA TÁCTIL DE LILYPAD
===================================================== */

.lilypad-link{
    position:absolute;

    left:35%;
    top:70%;

    width:30%;
    height:17%;

    z-index:20;

    background:transparent;

    cursor:pointer;

    -webkit-tap-highlight-color:
        transparent;

    tap-highlight-color:
        transparent;
}


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

.music-button{
    position:fixed;

    right:15px;
    bottom:15px;

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    color:white;

    font-size:21px;

    z-index:50;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 10px
        rgba(
            255,
            255,
            255,
            .4
        );
}


/* =====================================================
   CONFETI
===================================================== */

.confetti{
    position:fixed;

    width:8px;
    height:14px;

    z-index:100;

    pointer-events:none;

    animation:
        confettiFall
        3s
        linear
        forwards;
}

@keyframes confettiFall{

    0%{

        transform:
            translateY(-20px)
            rotate(0deg);

        opacity:1;
    }

    100%{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}


/* =====================================================
   SERPENTINAS
===================================================== */

.streamer{
    position:fixed;

    width:7px;
    height:100px;

    z-index:99;

    border-radius:10px;

    pointer-events:none;

    animation:
        streamerFall
        3.2s
        ease-in
        forwards;
}

@keyframes streamerFall{

    0%{

        transform:
            translateY(-120px)
            rotate(0deg);

        opacity:1;
    }

    100%{

        transform:
            translateY(110vh)
            rotate(540deg);

        opacity:0;
    }
}


/* =====================================================
   DESVANECER PRIMERA PANTALLA
===================================================== */

.toy-screen.hide{
    opacity:0;

    pointer-events:none;

    transition:
        opacity 1s ease;
}

</style>
</head>


<body>


<!-- ===================================================
     PANTALLA PRINCIPAL
=================================================== -->

<div
    class="toy-screen"
    id="toyScreen"
>

    <img
        src="fondo toys story.png"
        class="main-background"
        alt="Fondo"
    >


    <!-- Estrellas -->

    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>
    <div class="star star5"></div>
    <div class="star star6"></div>
    <div class="star star7"></div>
    <div class="star star8"></div>


    <!-- Estrellas fugaces -->

    <div
        class="shooting-star shooting1">
    </div>

    <div
        class="shooting-star shooting2">
    </div>


    <!-- Abrir invitación -->

    <div
        class="open-title"
        id="openInvitation"
    >
        ABRIR INVITACIÓN
    </div>


    <!-- Subtítulo -->

    <div class="subtitle">
        ✨ ¡Una aventura te espera! ✨
    </div>

</div>



<!-- ===================================================
     PÁGINA 2
=================================================== -->

<div
    class="page2"
    id="page2"
>


    <!-- Imagen original -->

    <img
        src="pagina 2.png"
        class="invitation-image"
        alt="Invitación"
    >


    <!-- Globos -->

    <div
        id="balloonContainer">
    </div>


    <!-- Estrellas -->

    <div
        id="starContainer">
    </div>


    <!-- Brillo Lilypad -->

    <div
        class="lilypad-glow">
    </div>


    <!-- Zona táctil Lilypad -->

    <a
        class="lilypad-link"

        href="https://maps.app.goo.gl/ErKKQbnFPtNkmCkM7"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Abrir ubicación en Google Maps"
    ></a>

</div>



<!-- ===================================================
     MÚSICA
=================================================== -->

<audio
    id="music"
    src="Toys Story.mp3"
    loop
    preload="auto">
</audio>


<!-- Botón música -->

<button
    class="music-button"
    id="musicButton"
    aria-label="Controlar música"
>
    🔊
</button>



<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const openInvitation =
    document.getElementById(
        "openInvitation"
    );

const toyScreen =
    document.getElementById(
        "toyScreen"
    );

const page2 =
    document.getElementById(
        "page2"
    );

const music =
    document.getElementById(
        "music"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );

const balloonContainer =
    document.getElementById(
        "balloonContainer"
    );

const starContainer =
    document.getElementById(
        "starContainer"
    );


/* =====================================================
   VOLUMEN
===================================================== */

music.volume = 0.7;


/* =====================================================
   ABRIR INVITACIÓN
===================================================== */

openInvitation.addEventListener(
    "click",
    function(){

        /* Iniciar música */

        music.play().catch(
            function(){

                console.log(
                    "El navegador bloqueó el autoplay."
                );

            }
        );


        /* Confeti */

        createConfetti();


        /* Serpentinas */

        createStreamers();


        /* Mostrar página 2 */

        setTimeout(
            function(){

                toyScreen.classList.add(
                    "hide"
                );

                page2.classList.add(
                    "show"
                );

            },
            500
        );

    }
);


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

musicButton.addEventListener(
    "click",
    function(){

        if(music.paused){

            music.play();

            musicButton.textContent =
                "🔊";

        }
        else{

            music.pause();

            musicButton.textContent =
                "🔇";

        }

    }
);


/* =====================================================
   CONFETI
===================================================== */

function createConfetti(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    for(
        let i=0;
        i<90;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random()*100 +
            "vw";


        piece.style.top =
            (-Math.random()*30) +
            "vh";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animationDelay =
            Math.random()*.8 +
            "s";


        piece.style.transform =
            "rotate(" +
            Math.random()*360 +
            "deg)";


        document.body.appendChild(
            piece
        );


        setTimeout(
            function(){

                piece.remove();

            },
            4000
        );

    }

}


/* =====================================================
   SERPENTINAS
===================================================== */

function createStreamers(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    for(
        let i=0;
        i<18;
        i++
    ){

        const streamer =
            document.createElement(
                "div"
            );


        streamer.className =
            "streamer";


        streamer.style.left =
            Math.random()*100 +
            "vw";


        streamer.style.top =
            (-Math.random()*20) +
            "vh";


        streamer.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        streamer.style.height =
            (
                60 +
                Math.random()*80
            ) +
            "px";


        streamer.style.animationDelay =
            Math.random()*.8 +
            "s";


        document.body.appendChild(
            streamer
        );


        setTimeout(
            function(){

                streamer.remove();

            },
            4500
        );

    }

}


/* =====================================================
   CREAR GLOBOS
===================================================== */

function createBalloons(){

    const colors = [

        "#ef5350",
        "#ffd83d",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ff8a65",
        "#ec407a"

    ];


    /* Entre 1 y 3 globos */

    const amount =
        Math.floor(
            Math.random()*3
        ) + 1;


    for(
        let i=0;
        i<amount;
        i++
    ){

        const balloon =
            document.createElement(
                "div"
            );


        balloon.className =
            "balloon";


        /* Posición horizontal */

        balloon.style.left =
            (
                10 +
                Math.random()*80
            ) +
            "%";


        /* Color */

        balloon.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        /* Tamaño */

        const size =
            30 +
            Math.random()*15;


        balloon.style.width =
            size +
            "px";


        balloon.style.height =
            (
                size*1.25
            ) +
            "px";


        /* Velocidad */

        balloon.style.animationDuration =
            (
                6.5 +
                Math.random()*2
            ) +
            "s";


        balloonContainer.appendChild(
            balloon
        );


        /* Eliminar */

        setTimeout(
            function(){

                balloon.remove();

            },
            9500
        );

    }


    /* Próximo grupo:
       4 a 6 segundos */

    const nextTime =
        4000 +
        Math.random()*2000;


    setTimeout(
        createBalloons,
        nextTime
    );

}


/* =====================================================
   CREAR ESTRELLA MÁGICA
===================================================== */

function createMagicStar(){

    const star =
        document.createElement(
            "div"
        );


    star.className =
        "magic-star";


    /* Posición aleatoria */

    star.style.left =
        (
            5 +
            Math.random()*90
        ) +
        "%";


    star.style.top =
        (
            5 +
            Math.random()*88
        ) +
        "%";


    /* Tamaño */

    const size =
        4 +
        Math.random()*6;


    star.style.width =
        size +
        "px";


    star.style.height =
        size +
        "px";


    /* Duración */

    star.style.animationDuration =
        (
            2 +
            Math.random()*2
        ) +
        "s";


    /* Pequeño retraso */

    star.style.animationDelay =
        (
            Math.random()*.5
        ) +
        "s";


    starContainer.appendChild(
        star
    );


    /* Eliminar */

    setTimeout(
        function(){

            star.remove();

        },
        4500
    );

}


/* =====================================================
   GENERADOR DE ESTRELLAS
===================================================== */

function starLoop(){

    /* Entre 1 y 3 estrellas */

    const amount =
        Math.floor(
            Math.random()*3
        ) + 1;


    for(
        let i=0;
        i<amount;
        i++
    ){

        createMagicStar();

    }


    /* Nuevas estrellas
       cada 1.5 - 3 segundos */

    const nextTime =
        1500 +
        Math.random()*1500;


    setTimeout(
        starLoop,
        nextTime
    );

}


/* =====================================================
   INICIAR EFECTOS
===================================================== */

setTimeout(
    function(){

        createBalloons();

        starLoop();

    },
    2000
);

</script>

</body>
</html>
