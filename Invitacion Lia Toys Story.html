
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitación — Toy Story</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
  background:#000;
}

.scene{
  min-height:100vh;
  width:100%;
  position:relative;
  overflow:hidden;

  /* TU IMAGEN DE FONDO */
  background-image:url("fondo toys story.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.content{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;
}

.card{
  text-align:center;
  color:white;
  text-shadow:0 3px 5px rgba(24,91,125,.28);
}

.card h1{
  font-size:clamp(42px,10vw,90px);
  margin:0;
  font-weight:900;
  letter-spacing:1px;
}

.card p{
  font-size:clamp(18px,4vw,28px);
  margin:10px 0 28px;
  font-weight:700;
}

/* Música */
#audio{
  display:none;
}
</style>
</head>

<body>

<div class="scene">

  <div class="content">
    <div class="card">
      <h1>¡Una aventura comienza!</h1>
      <p>Invitación de cumpleaños · Estilo Toy Story</p>
    </div>
  </div>

  <!-- MÚSICA -->
  <audio id="audio" preload="auto" autoplay loop>
    <source src="Toys Story.mp3" type="audio/mpeg">
  </audio>

</div>

<script>

const audio = document.getElementById("audio");

/* Intentar reproducir automáticamente */
window.addEventListener("load", () => {

  audio.play().catch(() => {
    console.log("El navegador bloqueó el autoplay.");
  });

});

/* Si el navegador bloquea el autoplay,
   el primer toque/clic inicia la música */
document.addEventListener("click", () => {

  if (audio.paused) {
    audio.play().catch(() => {});
  }

}, { once:true });

</script>

</body>
</html>
